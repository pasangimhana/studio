<title>Twelve Dragons</title>
<meta name="description" content="12 ways to draw a dragon, animated in a 4:3 grid.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=JetBrains+Mono:wght@400;700&family=Bangers&display=swap" rel="stylesheet">
<style>
/* Layout: fixed 1440x1080 (4:3) stage, 4x3 grid of canvas panels, scaled to fit the window */
:root {
  --ink: #0f0d14;
  --panel: #1b1822;
  --paper: #f2ede4;
  --muted: #8d8699;
  --ember: #ff6a3d;
  --display: 'Unbounded', 'DejaVu Sans', system-ui, sans-serif;
  --mono: 'JetBrains Mono', 'DejaVu Sans Mono', ui-monospace, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--ink); color: var(--paper); overflow: hidden; }
#stage {
  position: absolute; left: 50%; top: 50%;
  width: 1440px; height: 1080px;
  transform: translate(-50%, -50%) scale(var(--k, 1));
  background: var(--ink);
  font-family: var(--display);
}
header {
  position: absolute; left: 28px; right: 28px; top: 22px; height: 72px;
  display: flex; align-items: flex-end; justify-content: space-between; gap: 24px;
}
h1 { margin: 0; font-size: 50px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; text-wrap: balance; }
h1 em { font-style: normal; color: var(--ember); }
.sub { font-family: var(--mono); font-size: 15px; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; padding-bottom: 4px; }
#grid {
  position: absolute; left: 24px; top: 112px; width: 1392px; height: 944px;
  display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(3, 1fr); gap: 16px;
}
.cell { position: relative; border-radius: 12px; overflow: hidden; background: var(--panel); }
.cell canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.tag {
  position: absolute; left: 10px; bottom: 10px;
  display: flex; align-items: baseline; gap: 8px;
  padding: 5px 11px 6px; border-radius: 999px;
  background: rgba(12, 10, 16, 0.78); color: var(--paper);
  font-family: var(--display); font-size: 14px; font-weight: 500; letter-spacing: 0.01em;
}
.tag b { font-family: var(--mono); font-size: 12px; font-weight: 700; color: var(--ember); }
</style>

<div id="stage">
  <header>
    <h1>12 ways to draw a <em>dragon</em></h1>
    <div class="sub">twelve dragons · twelve hands</div>
  </header>
  <div id="grid"></div>
</div>

<script>
(() => {
const TAU = Math.PI * 2;
const LOOP = 8; // seconds; every animation period divides this
const DPR = 2;
const CAPTURE = location.hash === '#capture';

/* ---------- helpers ---------- */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const hash = x => { const s = Math.sin(x * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const NS = 'http://www.w3.org/2000/svg';
const meas = document.createElementNS(NS, 'svg');
meas.setAttribute('width', 0); meas.setAttribute('height', 0);
meas.style.position = 'absolute';
document.body.appendChild(meas);
function sample(d, step = 1.2) {
  const p = document.createElementNS(NS, 'path');
  p.setAttribute('d', d); meas.appendChild(p);
  const L = p.getTotalLength(), n = Math.max(2, Math.ceil(L / step)), out = [];
  for (let i = 0; i <= n; i++) { const q = p.getPointAtLength(L * i / n); out.push([q.x, q.y]); }
  p.remove(); return out;
}
function trace(ctx, pts, close = true) {
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  if (close) ctx.closePath();
}
function path2d(list, close = true) { const p = new Path2D(); for (const pts of list) trace(p, pts, close); return p; }
function polyLen(pts) { let L = 0; for (let i = 1; i < pts.length; i++) L += Math.hypot(pts[i][0] - pts[i-1][0], pts[i][1] - pts[i-1][1]); return L; }
function partial(ctx, pts, len) { // stroke first `len` units of a polyline, return tip
  let acc = 0; ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) {
    const [ax, ay] = pts[i-1], [bx, by] = pts[i], d = Math.hypot(bx - ax, by - ay);
    if (acc + d >= len) { const f = (len - acc) / d; const x = ax + (bx - ax) * f, y = ay + (by - ay) * f; ctx.lineTo(x, y); return [x, y]; }
    ctx.lineTo(bx, by); acc += d;
  }
  return pts[pts.length - 1];
}
function rdp(pts, eps) {
  if (pts.length < 3) return pts;
  const [fx, fy] = pts[0], [lx, ly] = pts[pts.length - 1];
  if (Math.hypot(fx - lx, fy - ly) < 0.01) { const h = pts.length >> 1; return rdp(pts.slice(0, h + 1), eps).slice(0, -1).concat(rdp(pts.slice(h), eps)); }
  let dmax = 0, idx = 0; const [ax, ay] = pts[0], [bx, by] = pts[pts.length - 1];
  const L = Math.hypot(bx - ax, by - ay) || 1;
  for (let i = 1; i < pts.length - 1; i++) {
    const d = Math.abs((bx - ax) * (ay - pts[i][1]) - (ax - pts[i][0]) * (by - ay)) / L;
    if (d > dmax) { dmax = d; idx = i; }
  }
  if (dmax > eps) return rdp(pts.slice(0, idx + 1), eps).slice(0, -1).concat(rdp(pts.slice(idx), eps));
  return [pts[0], pts[pts.length - 1]];
}
function delaunay(pts) {
  const n = pts.length; let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const [x, y] of pts) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
  const d = Math.max(x1 - x0, y1 - y0) * 20, mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
  const P = pts.concat([[mx - d, my - d], [mx, my + d], [mx + d, my - d]]);
  const circ = (a, b, c) => {
    const [ax, ay] = P[a], [bx, by] = P[b], [cx, cy] = P[c];
    const D = 2 * (ax * (by - cy) + bx * (cy - ay) + cx * (ay - by));
    const ux = ((ax*ax + ay*ay) * (by - cy) + (bx*bx + by*by) * (cy - ay) + (cx*cx + cy*cy) * (ay - by)) / D;
    const uy = ((ax*ax + ay*ay) * (cx - bx) + (bx*bx + by*by) * (ax - cx) + (cx*cx + cy*cy) * (bx - ax)) / D;
    return { a, b, c, x: ux, y: uy, r: (ux - ax) ** 2 + (uy - ay) ** 2 };
  };
  let tris = [circ(n, n + 1, n + 2)];
  for (let i = 0; i < n; i++) {
    const [px, py] = P[i], edges = [], keep = [];
    for (const t of tris) {
      if ((px - t.x) ** 2 + (py - t.y) ** 2 < t.r) edges.push([t.a, t.b], [t.b, t.c], [t.c, t.a]); else keep.push(t);
    }
    const uniq = edges.filter((e, j) => !edges.some((f, k) => k !== j && ((e[0] === f[0] && e[1] === f[1]) || (e[0] === f[1] && e[1] === f[0]))));
    for (const [a, b] of uniq) keep.push(circ(a, b, i));
    tris = keep;
  }
  return tris.filter(t => t.a < n && t.b < n && t.c < n).map(t => [t.a, t.b, t.c]);
}

// map base space (200 x 160) into a box inside the panel
function fit(W, H, box) {
  box = box || { x: 12, y: 10, w: W - 24, h: H - 50 };
  const s = Math.min(box.w / 190, box.h / 140);
  return { s, ox: box.x + box.w / 2 - 97 * s, oy: box.y + box.h / 2 - 80 * s };
}
function enter(ctx, W, H, box) { const m = fit(W, H, box); ctx.save(); ctx.translate(m.ox, m.oy); ctx.scale(m.s, m.s); return m; }
const flap = (t, period) => Math.sin(TAU * t / period);
const rot = (p, c, a, sx = 1, sy = 1) => { const dx = (p[0] - c[0]) * sx, dy = (p[1] - c[1]) * sy, C = Math.cos(a), S = Math.sin(a); return [c[0] + dx * C - dy * S, c[1] + dx * S + dy * C]; };
const mirror = (pts, cx = 100) => pts.map(([x, y]) => [2 * cx - x, y]);
const catmull = (pts, n = 10) => {
  const out = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
    for (let k = 0; k < n; k++) {
      const t = k / n, t2 = t * t, t3 = t2 * t;
      out.push([0, 1].map(j => 0.5 * ((2 * p1[j]) + (-p0[j] + p2[j]) * t + (2 * p0[j] - 5 * p1[j] + 4 * p2[j] - p3[j]) * t2 + (-p0[j] + 3 * p1[j] - 3 * p2[j] + p3[j]) * t3)));
    }
  }
  out.push(pts[pts.length - 1]); return out;
};
function normals(sp, center) {
  return sp.map((p, i) => {
    const a = sp[Math.max(0, i - 1)], b = sp[Math.min(sp.length - 1, i + 1)];
    let nx = b[1] - a[1], ny = -(b[0] - a[0]); const L = Math.hypot(nx, ny) || 1; nx /= L; ny /= L;
    if (center && (p[0] - center[0]) * nx + (p[1] - center[1]) * ny < 0) { nx = -nx; ny = -ny; }
    return [nx, ny];
  });
}

/* ---------- styles: every panel is its own dragon ---------- */
const STYLES = [];
const style = (name, init, draw) => STYLES.push({ name, init, draw });

// 1 — one continuous line: a dragon curled up asleep, drawn without lifting the pen
style('One Line', () => {
  // a dragon in flight, facing left, drawn without lifting the pen
  const D = {
    body: 'M 66 100 C 80 88, 104 84, 122 88 C 132 80, 136 68, 142 56 C 146 48, 152 44, 160 45 C 168 46, 178 50, 186 55 C 188 58, 187 60, 183 61 C 174 62, 164 62, 158 64 C 152 68, 150 76, 146 86 C 142 100, 134 112, 118 116 C 102 121, 84 121, 70 116 C 56 120, 38 126, 26 118 C 18 112, 14 102, 14 92 L 5 91 L 13 76 L 23 89 L 17 92 C 19 102, 23 108, 31 110 C 43 113, 55 108, 66 100 Z',
    spine: 'M 60 104 C 80 88, 104 84, 122 88 C 132 80, 136 68, 142 56',
    legF: 'M 121 110 C 127 118, 129 126, 127 133 L 122 139 L 138 139 L 135 133 C 138 124, 137 114, 135 106 Z',
    legB: 'M 70 106 C 63 117, 69 127, 72 133 L 67 139 L 85 139 L 81 131 C 81 124, 86 117, 89 112 Z',
    hornA: 'M 151 48 C 145 42, 138 37, 128 35 C 136 41, 141 48, 145 54 Z',
    hornB: 'M 157 46 C 153 39, 148 33, 141 29 C 145 37, 149 43, 151 48 Z',
    wing: 'M 114 88 L 104 42 L 76 14 Q 74 31 58 37 Q 67 50 50 62 Q 64 66 68 81 Q 92 79 114 88 Z',
    bones: ['M 114 88 L 104 42 L 76 14', 'M 104 42 L 58 37', 'M 104 42 L 50 62', 'M 104 42 L 68 81'],
    mouth: 'M 184 60 L 167 59',
  };
  const flip = pts => pts.map(([x, y]) => [194 - x, y + 4]);
  const parts = [D.body, D.hornB, D.hornA, D.legF, D.legB, D.wing, ...D.bones].map(d => flip(sample(d)));
  const eyeC = flip([[165, 51]])[0];
  const ring = Array.from({ length: 13 }, (_, i) => [eyeC[0] + 2.2 * Math.cos(i / 12 * TAU), eyeC[1] + 2.2 * Math.sin(i / 12 * TAU)]);
  const line = [].concat(...parts, ring);
  return { line, L: polyLen(line), eye: null };
}, (ctx, t, W, H, st) => {
  ctx.fillStyle = '#efe8da'; ctx.fillRect(0, 0, W, H);
  const p = smooth(0, 5.2, t), fade = 1 - smooth(7.25, 7.9, t), br = 1 + 0.012 * Math.sin(TAU * t / 2);
  enter(ctx, W, H); ctx.translate(98, 84); ctx.scale(br, br); ctx.translate(-98, -84);
  ctx.globalAlpha = fade; ctx.lineJoin = ctx.lineCap = 'round'; ctx.strokeStyle = '#1c1a22'; ctx.lineWidth = 1.25;
  ctx.beginPath(); const tip = partial(ctx, st.line, Math.max(0.01, p * st.L)); ctx.stroke();
  if (p < 1) { ctx.fillStyle = '#e8492a'; ctx.beginPath(); ctx.arc(tip[0], tip[1], 2.4, 0, TAU); ctx.fill(); }
  ctx.restore(); ctx.globalAlpha = 1;
});

// 2 — pencil sketch: a seated dragon facing left, with construction circles
style('Pencil Sketch', () => {
  const d = [
    'M 86 30 C 80 21, 67 19, 58 25 C 52 28, 45 30, 38 33 C 35 36, 37 40, 42 41 C 50 42, 58 42, 64 44 C 69 48, 73 50, 77 51',
    'M 86 30 C 95 40, 97 56, 101 70 C 105 80, 116 82, 128 84 C 146 88, 151 112, 143 128 C 139 134, 133 136, 124 136',
    'M 77 51 C 74 61, 70 71, 70 83 C 70 97, 73 110, 76 124 L 72 136 L 62 138 L 62 140 L 80 140 L 80 132',
    'M 84 112 C 88 120, 90 128, 89 136 L 80 138 L 82 140 L 98 140 L 97 133 C 96 124, 95 116, 93 108',
    'M 124 136 C 110 136, 103 128, 106 117 C 109 106, 124 102, 132 110',
    'M 124 136 L 110 138 L 108 140 L 130 140',
    'M 143 128 C 152 142, 122 148, 92 146 C 72 145, 58 143, 52 136',
    'M 136 136 C 126 141, 108 142, 92 141 C 74 140, 62 138, 56 132',
    'M 52 136 L 44 128 L 46 136 L 36 140 L 48 141 L 56 132',
    'M 100 68 C 112 50, 128 38, 150 28 C 146 42, 148 54, 152 66 C 146 64, 140 66, 137 72 C 132 70, 126 72, 124 80',
    'M 100 68 L 150 28', 'M 126 46 L 137 72',
    'M 82 27 C 88 16, 96 10, 106 8 C 99 16, 95 23, 89 32',
    'M 75 22 C 77 12, 81 6, 89 3 C 85 11, 83 17, 81 24',
    'M 42 41 L 56 39',
    'M 71 88 Q 78 91 84 87', 'M 71 97 Q 79 100 86 96', 'M 72 106 Q 80 109 88 105', 'M 74 115 Q 81 118 89 114',
    'M 57 31 Q 61 28 65 31 Q 61 33 57 31',
  ].map(p => sample(p, 1));
  const back = sample('M 86 30 C 95 40, 97 56, 101 70', 0.5), spikes = [];
  for (let f = 0.08; f < 0.9; f += 0.13) {
    const i = Math.floor(f * (back.length - 2)), [x, y] = back[i], [x2, y2] = back[i + 1], L = Math.hypot(x2 - x, y2 - y), tx = (x2 - x) / L, ty = (y2 - y) / L;
    spikes.push([[x - tx * 2, y - ty * 2], [x - ty * 5 - tx * 2, y + tx * 5 - ty * 2], [x + tx * 2.5, y + ty * 2.5]]);
  }
  return { parts: d.concat(spikes) };
}, (ctx, t, W, H, st) => {
  ctx.fillStyle = '#f6f2e8'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(90,130,200,.16)'; ctx.lineWidth = 1;
  for (let y = 22; y < H; y += 18) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  ctx.strokeStyle = 'rgba(220,80,80,.25)'; ctx.beginPath(); ctx.moveTo(30, 0); ctx.lineTo(30, H); ctx.stroke();
  const fr = Math.floor(t * 8);
  enter(ctx, W, H); ctx.lineJoin = ctx.lineCap = 'round';
  const jit = (pts, seed, amp) => pts.map(([x, y], i) => [x + amp * (Math.sin(i * 0.07 + seed) * 0.8 + Math.sin(i * 0.23 + seed * 1.7) * 0.4), y + amp * (Math.sin(i * 0.09 + seed * 2.3) * 0.8 + Math.sin(i * 0.19 + seed * 0.6) * 0.4)]);
  // construction
  ctx.strokeStyle = 'rgba(60,70,110,.22)'; ctx.lineWidth = 0.45;
  const j = hash(fr) * 0.8;
  ctx.beginPath(); ctx.arc(62 + j, 33, 15, 0, TAU); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(84, 96 + j, 17, 26, 0.08, 0, TAU); ctx.stroke();
  ctx.beginPath(); ctx.arc(124, 114 - j, 23, 0, TAU); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(56, 22); ctx.bezierCurveTo(96, 38, 78, 110, 128, 146); ctx.stroke();
  // shading
  ctx.save(); ctx.beginPath(); ctx.ellipse(122, 116, 24, 22, 0, 0, TAU); ctx.ellipse(80, 100, 14, 26, 0.08, 0, TAU); ctx.clip();
  ctx.strokeStyle = 'rgba(60,60,70,.22)'; ctx.lineWidth = 0.45;
  for (let k = -40; k < 200; k += 3.2) { const q = hash(k + fr) * 1.4; ctx.beginPath(); ctx.moveTo(k + q, 150); ctx.lineTo(k + 60 + q, 60); ctx.stroke(); }
  ctx.restore();
  ctx.save(); ctx.beginPath(); trace(ctx, st.parts[9], true); ctx.clip();
  ctx.strokeStyle = 'rgba(60,60,70,.2)'; ctx.lineWidth = 0.4;
  for (let k = 60; k < 240; k += 3.6) { const q = hash(k * 3 + fr) * 1.4; ctx.beginPath(); ctx.moveTo(k + q, 20); ctx.lineTo(k - 60 + q, 90); ctx.stroke(); }
  ctx.restore();
  for (let pass = 0; pass < 2; pass++) {
    ctx.strokeStyle = pass ? 'rgba(35,35,45,.85)' : 'rgba(35,35,45,.35)'; ctx.lineWidth = pass ? 0.8 : 0.55;
    st.parts.forEach((pts, i) => { ctx.beginPath(); trace(ctx, jit(pts, fr * 3.1 + i * 7 + pass * 11, pass ? 0.5 : 1), false); ctx.stroke(); });
  }
  const blink = (t % 4) > 2.6 && (t % 4) < 2.78;
  ctx.fillStyle = '#26252d'; ctx.beginPath(); ctx.ellipse(61, 31, 1.3, blink ? 0.3 : 1.5, 0, 0, TAU); ctx.fill();
  // smoke curls from the nostril
  ctx.strokeStyle = 'rgba(60,60,70,.45)'; ctx.lineWidth = 0.5;
  for (let k = 0; k < 3; k++) {
    const u = ((t / 2 + k / 3) % 1), x = 38 - u * 14, y = 32 - u * 26, r = 1.5 + u * 5;
    ctx.globalAlpha = Math.sin(Math.PI * u);
    ctx.beginPath(); for (let a = 0; a < 7; a += 0.2) ctx.lineTo(x + Math.cos(a + u * 4) * r * (1 - a / 9), y + Math.sin(a + u * 4) * r * (1 - a / 9)); ctx.stroke();
  }
  ctx.globalAlpha = 1; ctx.restore();
});

// 3 — pixel art: a chubby red RPG hatchling that breathes fire
style('Pixel Art', () => {
  const c = document.createElement('canvas'); c.width = 80; c.height = 64;
  const clouds = [[10, 18, 5], [120, 10, 4], [70, 30, 3]];
  return { c, x: c.getContext('2d', { willReadFrequently: true }), clouds };
}, (ctx, t, W, H, st) => {
  const m = fit(W, H), px = 2.5 * m.s, q = v => Math.round(v / px) * px;
  const bands = ['#63c7ff', '#79d0ff', '#8fd9ff', '#a6e2ff'];
  bands.forEach((c, i) => { ctx.fillStyle = c; ctx.fillRect(0, q(i * H / 5), W, H); });
  ctx.fillStyle = '#fff';
  for (const [x0, y0, s] of st.clouds) {
    const x = q(((x0 + t / 8 * 200) % 240 - 30) * m.s + m.ox), y = q(y0 * m.s + m.oy);
    ctx.fillRect(x, y, px * s * 3, px * 2); ctx.fillRect(x + px, y - px, px * s * 2, px);
  }
  const gy = q(m.oy + 138 * m.s);
  ctx.fillStyle = '#48b84e'; ctx.fillRect(0, gy, W, H); ctx.fillStyle = '#2f8a3a';
  for (let x = 0; x < W; x += px * 2) ctx.fillRect(x, gy, px, px);
  ctx.fillStyle = '#8b5a2b'; ctx.fillRect(0, gy + px * 3, W, H);
  ctx.fillStyle = '#6e4420'; for (let x = 0; x < W; x += px * 4) ctx.fillRect(x + ((x / px / 4) % 2) * px, gy + px * 5, px * 2, px);
  const fr = Math.floor(t * 8), up = fr % 4 < 2, hop = (fr % 8 < 4) ? 0 : -2.5;
  const x = st.x; x.setTransform(1, 0, 0, 1, 0, 0); x.clearRect(0, 0, 80, 64); x.setTransform(0.4, 0, 0, 0.4, 0, 0); x.translate(0, hop);
  const E = (cx, cy, rx, ry, col) => { x.fillStyle = col; x.beginPath(); x.ellipse(cx, cy, rx, ry, 0, 0, TAU); x.fill(); };
  const Pg = (pts, col) => { x.fillStyle = col; x.beginPath(); trace(x, pts); x.fill(); };
  const wing = [[64, 88], [48, 50], [40, 60], [32, 48], [26, 64], [18, 58], [26, 82], [56, 98]].map(p => up ? p : rot(p, [64, 88], -1.0, 1, 0.7));
  Pg(wing, '#8a4fd1');
  Pg([[64, 88], [48, 50], [44, 70], [58, 92]].map(p => up ? p : rot(p, [64, 88], -1.0, 1, 0.7)), '#b27cf0');
  x.lineCap = 'round'; x.strokeStyle = '#e04a3f'; x.lineWidth = 10; x.beginPath(); x.moveTo(60, 116); x.bezierCurveTo(40, 126, 24, 118, 22, 100); x.stroke();
  Pg([[13, 100], [22, 82], [31, 100]], '#ffb347');
  E(64, 132, 10, 7, '#c23a32'); E(90, 132, 10, 7, '#c23a32');
  E(76, 108, 27, 25, '#e04a3f'); E(84, 114, 15, 16, '#ffd166');
  E(100, 106, 7, 6, '#c23a32');
  Pg([[92, 52], [86, 32], [102, 48]], '#ffb347'); Pg([[112, 48], [116, 29], [124, 52]], '#ffb347');
  Pg([[84, 62], [74, 60], [82, 72]], '#ffb347'); Pg([[80, 78], [68, 78], [78, 88]], '#ffb347');
  E(108, 72, 24, 23, '#e04a3f'); E(130, 80, 18, 13, '#e04a3f');
  const img = x.getImageData(0, 0, 80, 64), d = img.data, solid = new Uint8Array(80 * 64);
  for (let i = 0; i < 80 * 64; i++) solid[i] = d[i * 4 + 3] > 110 ? 1 : 0;
  for (let yy = 0; yy < 64; yy++) for (let xx = 0; xx < 80; xx++) {
    const i = yy * 80 + xx, o = i * 4;
    if (solid[i]) {
      d[o + 3] = 255;
