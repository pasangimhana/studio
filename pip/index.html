<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Pip the Walker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    /* Layout: full-bleed 3D scene on an endless white floor; name top-left, status card top-right, dark control dock bottom-centre.
       Light only by design: a white studio, with the walker's navy and blue as the only accents. */
    :root {
      --paper: #fbfbfa;
      --card: rgba(255, 255, 255, 0.92);
      --ink: #1f2124;
      --dim: #7a7b7e;
      --hair: rgba(31, 33, 36, 0.08);
      --accent: #2d5fb8;
      --accent-hi: #3a70cc;
      --dock: #23262c;
      --dock-fg: #f1f0ec;
      --dock-dim: rgba(241, 240, 236, 0.45);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 18px 44px rgba(31, 33, 36, 0.08);
      --sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      --mono: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
      color-scheme: light;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 15px; overflow: hidden; -webkit-font-smoothing: antialiased; font-feature-settings: "tnum" 1, "cv11" 1; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    kbd { font-family: var(--mono); font-size: 11px; font-weight: 400; }

    #world { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: manipulation; }

    #top { position: fixed; left: 40px; top: calc(30px + env(safe-area-inset-top, 0px)); pointer-events: none; }
    #top h1, #loader h1 { font-weight: 700; font-size: 56px; line-height: 1; letter-spacing: -0.045em; }
    #top h1 em, #loader h1 em { color: var(--accent); font-style: normal; }
    #top p { margin-top: 10px; font-size: 15px; font-weight: 500; color: var(--dim); }

    .card { background: var(--card); border: 1px solid var(--hair); border-radius: 18px; box-shadow: var(--shadow); }
    .kicker { font-size: 11.5px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }

    #status { position: fixed; right: 40px; top: calc(36px + env(safe-area-inset-top, 0px)); width: 300px; padding: 16px 18px 15px; pointer-events: none; }
    #doing { margin-top: 8px; font-size: 26px; font-weight: 700; line-height: 1.1; letter-spacing: -0.035em; text-wrap: balance; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--hair); }
    .stats b { display: block; font-size: 20px; font-weight: 700; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .stats span { display: block; margin-top: 5px; font-size: 11.5px; color: var(--dim); }

    #hint {
      position: fixed; left: 50%; bottom: calc(108px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
      padding: 8px 15px; border-radius: 999px; background: var(--card); box-shadow: var(--shadow);
      font-size: 13.5px; color: var(--dim); white-space: nowrap; pointer-events: none; transition: opacity 0.6s ease;
    }
    #hint b { color: var(--ink); font-weight: 600; }
    #hint.gone { opacity: 0; }

    #dock {
      position: fixed; left: 50%; bottom: calc(32px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
      display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px; padding: 8px;
      width: max-content; max-width: calc(100vw - 32px); background: var(--dock); border-radius: 22px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12), 0 20px 44px rgba(0, 0, 0, 0.2);
    }
    #dock .group { display: flex; align-items: center; gap: 4px; }
    #dock .sep { width: 1px; height: 30px; background: rgba(255, 255, 255, 0.14); margin: 0 8px; }
    #dock .glabel { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dock-dim); margin: 0 6px 0 4px; }
    .dbtn {
      height: 52px; padding: 0 18px; border-radius: 14px; color: var(--dock-fg);
      display: flex; align-items: center; justify-content: center; gap: 10px;
      font-size: 17px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap;
      transition: background 0.18s, color 0.18s;
    }
    .dbtn:hover { background: rgba(255, 255, 255, 0.09); }
    .dbtn svg { width: 15px; height: 15px; flex: none; }
    .dbtn.play { background: var(--accent); color: #fff; padding: 0 22px 0 18px; }
    .dbtn.play:hover { background: var(--accent-hi); }
    .dbtn.on { background: var(--dock-fg); color: var(--ink); }
    .dbtn kbd { margin-left: 2px; color: var(--dock-dim); border: 1px solid rgba(255, 255, 255, 0.16); border-radius: 5px; padding: 1px 6px; }

    #loader { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: var(--paper); transition: opacity 0.8s ease; }
    #loader.gone { opacity: 0; pointer-events: none; }
    #loader .ld { font-size: 14px; color: var(--dim); }

    body.rec #dock, body.rec #hint { opacity: 0; pointer-events: none; }

    @media (max-width: 1150px) {
      #top { left: 24px; top: calc(20px + env(safe-area-inset-top, 0px)); }
      #top h1 { font-size: 40px; }
      #status { right: 24px; top: calc(22px + env(safe-area-inset-top, 0px)); width: 270px; padding: 13px 15px; }
      #doing { font-size: 22px; }
      .dbtn { height: 46px; padding: 0 14px; font-size: 15px; }
      .dbtn kbd { display: none; }
    }
    @media (max-width: 720px) {
      #top { left: 16px; top: calc(14px + env(safe-area-inset-top, 0px)); }
      #top h1 { font-size: 34px; }
      #top p { display: none; }
      #status { left: 16px; right: auto; top: calc(58px + env(safe-area-inset-top, 0px)); width: auto; max-width: calc(100vw - 32px); padding: 10px 13px; border-radius: 14px; }
      #status .kicker { display: none; }
      #doing { margin-top: 0; font-size: 17px; }
      .stats { gap: 14px; margin-top: 8px; padding-top: 8px; }
      .stats b { font-size: 15px; }
      .stats span { font-size: 10.5px; margin-top: 3px; }
      #dock { bottom: calc(14px + env(safe-area-inset-bottom, 0px)); padding: 5px; gap: 2px; border-radius: 16px; }
      #dock .glabel, #dock .sep { display: none; }
      .dbtn { height: 42px; padding: 0 8px; font-size: 13px; gap: 6px; border-radius: 11px; }
      .dbtn.play { padding: 0 12px; }
      .dbtn.play span { display: none; }
      #hint { bottom: calc(72px + env(safe-area-inset-bottom, 0px)); font-size: 12.5px; }
    }
  </style>
  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
  </script>
</head>
<body>
  <canvas id="world" aria-label="Pip, an armoured two-legged walker with three companion drones, walking across an endless white floor"></canvas>

  <header id="top"><h1>Pip<em>.</em></h1><p>A little walker and its three drones.</p></header>

  <aside id="status" class="card" aria-live="polite">
    <div class="kicker">Now</div>
    <div id="doing">On patrol</div>
    <div class="stats">
      <div><b id="st-steps">0</b><span>steps</span></div>
      <div><b id="st-dist">0.0</b><span>meters</span></div>
      <div><b id="st-time">0:00</b><span>on patrol</span></div>
    </div>
  </aside>

  <div id="hint"><b id="hint-verb">Click</b> the floor to send Pip somewhere</div>

  <nav id="dock" aria-label="Controls">
    <button id="btn-play" class="dbtn play" type="button"></button>
    <span class="sep"></span>
    <div class="group" role="group" aria-label="Camera">
      <span class="glabel">Camera</span>
      <button data-cam="auto" class="dbtn on" type="button">Auto</button>
      <button data-cam="follow" class="dbtn" type="button">Follow</button>
      <button data-cam="front" class="dbtn" type="button">Front</button>
      <button data-cam="side" class="dbtn" type="button">Side</button>
    </div>
    <span class="sep"></span>
    <button id="btn-hi" class="dbtn" type="button">Say hi<kbd>W</kbd></button>
  </nav>

  <div id="loader"><h1>Pip<em>.</em></h1><div class="ld">powering up</div></div>

  <script type="module">
    import * as THREE from 'three';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

    const $ = (s) => document.querySelector(s);
    const TAU = Math.PI * 2;
    const UP = new THREE.Vector3(0, 1, 0);

    // ---------------------------------------------------------------- look: a white studio that never ends
    const WHITE = new THREE.Color('#fbfbfa');       // floor and background are the same colour, so there is no horizon
    const INK = new THREE.Color('#1f2124');
    const ACCENT = new THREE.Color('#2d5fb8');
    const GLOW = new THREE.Color('#4cc8ff');

    // ---------------------------------------------------------------- the walker's body plan (world units; it stands ~1.2 tall)
    const WALK_V = 0.42, HURRY_V = 0.6;
    const T_SWING = 0.42, LIFT = 0.1;
    const STANCE_W = 0.27, HIP_X = 0.3;
    const PELVIS = 0.56, ANKLE_H = 0.1, TOE = 0.19, HEEL = 0.11;
    const L1 = 0.26, L2 = 0.27;
    const SX = 0.46, SY = 0.33, SZ = 0.4, CY = 0.33, CZ = 0.02;   // egg-shaped hull: semi-axes and centre (body frame)
    const EYE_Y = 0.34;

    const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
    const damp = (k, dt) => 1 - Math.exp(-k * dt);
    const wrap = (a) => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
    const angTo = (from, to) => wrap(to - from);
    const hump = (t, a, b) => (t <= a || t >= b ? 0 : Math.sin((Math.PI * (t - a)) / (b - a)));
    const Spring = (x = 0) => ({ x, v: 0 });
    function spring(s, target, dt, k = 60, c = 11) { s.v += ((target - s.x) * k - s.v * c) * dt; s.x += s.v * dt; return s.x; }

    // ---------------------------------------------------------------- materials (armour white, navy trim, dark mechanics, blue glow)
    const MAT = {
      armor: new THREE.MeshPhysicalMaterial({ color: 0xe8e7e3, roughness: 0.46, clearcoat: 0.35, clearcoatRoughness: 0.3 }),
      navy: new THREE.MeshPhysicalMaterial({ color: 0x2f4169, roughness: 0.5, clearcoat: 0.15, clearcoatRoughness: 0.35 }),
      mech: new THREE.MeshStandardMaterial({ color: 0x2b2c30, roughness: 0.5, metalness: 0.45 }),
      mech2: new THREE.MeshStandardMaterial({ color: 0x3e4046, roughness: 0.38, metalness: 0.55 }),
      steel: new THREE.MeshStandardMaterial({ color: 0xa9abb0, roughness: 0.22, metalness: 1 }),
      glass: new THREE.MeshPhysicalMaterial({ color: 0x05070b, roughness: 0.04, metalness: 0.2, clearcoat: 1, clearcoatRoughness: 0.02 }),
      glow: new THREE.MeshBasicMaterial({ color: GLOW, toneMapped: false }),
      glowHot: new THREE.MeshBasicMaterial({ color: 0xc9f3ff, toneMapped: false }),
      glowDim: new THREE.MeshBasicMaterial({ color: 0x2a6178, toneMapped: false }),
    };
    MAT.crest = MAT.navy.clone(); MAT.crest.side = THREE.DoubleSide;
    // hull: the armour material with panel seams and panel shading drawn in object space
    MAT.hull = MAT.armor.clone();
    MAT.hull.onBeforeCompile = (sh) => {
      sh.vertexShader = sh.vertexShader
        .replace('#include <common>', '#include <common>\nvarying vec3 vHull;')
        .replace('#include <begin_vertex>', '#include <begin_vertex>\nvHull = position;');
      sh.fragmentShader = sh.fragmentShader
        .replace('#include <common>', '#include <common>\nvarying vec3 vHull;\nfloat seamAt(float f, float c, float w) { return 1.0 - smoothstep(w, w + 1.5 * fwidth(f), abs(f - c)); }')
        .replace('#include <color_fragment>', `#include <color_fragment>
          vec3 n = vHull / vec3(${SX}, ${SY}, ${SZ});
          float side = step(0.33, abs(n.x)), front = step(0.62, n.z);
          float seam = seamAt(abs(n.x), 0.33, 0.004) * step(-0.25, n.y);
          seam = max(seam, seamAt(n.y, -0.3, 0.005));
          seam = max(seam, seamAt(n.z, 0.62, 0.005) * side * step(-0.3, n.y));
          seam = max(seam, seamAt(n.y, 0.4, 0.005) * side * (1.0 - front));
          seam = max(seam, seamAt(n.z, -0.4, 0.005) * step(-0.3, n.y));
          diffuseColor.rgb *= n.y < -0.3 ? 0.87 : (side > 0.5 && front < 0.5 && n.y < 0.4 ? 0.94 : 1.0);
          diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.09, 0.1, 0.12), seam * 0.8);`);
    };

    function mesh(geo, mat, parent) {
      const m = new THREE.Mesh(geo, mat);
      m.castShadow = true; m.receiveShadow = true;
      parent?.add(m);
      return m;
    }
    const rbox = (w, h, d, r, mat, parent, seg = 3) => mesh(new RoundedBoxGeometry(w, h, d, seg, r), mat, parent);
    const sphere = (r, mat, parent, seg = 32) => mesh(new THREE.SphereGeometry(r, seg, Math.round(seg * 0.66)), mat, parent);
    const axle = (r, h, mat, parent, seg = 24) => mesh(new THREE.CylinderGeometry(r, r, h, seg), mat, parent);
    const dome = (r) => new THREE.SphereGeometry(r, 40, 12, 0, TAU, 0, Math.PI / 2).rotateX(Math.PI / 2);   // cap facing +z
    // Object from a to b along its +Y, with +Z turned toward `fwd` (keeps armour facing forward).
    const _ay = new THREE.Vector3(), _az = new THREE.Vector3(), _ax = new THREE.Vector3(), _am = new THREE.Matrix4();
    function aimBasis(o, a, b, fwd) {
      _ay.subVectors(b, a).normalize();
      _az.copy(fwd).addScaledVector(_ay, -fwd.dot(_ay)).normalize();
      _ax.crossVectors(_ay, _az);
      o.position.copy(a);
      o.quaternion.setFromRotationMatrix(_am.makeBasis(_ax, _ay, _az));
    }

    // Front of the hull, and flat 2D plates bent onto it along its normal (their undersides sink in so no gap shows).
    function hullZ(x, y) { return CZ + SZ * Math.sqrt(Math.max(0, 1 - (x / SX) ** 2 - ((y - CY) / SY) ** 2)); }
    const V2 = (p) => new THREE.Vector2(p[0], p[1]);
    function densify(pts, n) {
      const out = [];
      pts.forEach((a, i) => { const b = pts[(i + 1) % pts.length]; for (let k = 0; k < n; k++) out.push([a[0] + (b[0] - a[0]) * (k / n), a[1] + (b[1] - a[1]) * (k / n)]); });
      return out.map(V2);
    }
    const rectPts = (cx, cy, w, h) => [[cx - w / 2, cy - h / 2], [cx + w / 2, cy - h / 2], [cx + w / 2, cy + h / 2], [cx - w / 2, cy + h / 2]];
    const hexPts = (r, cy, wide = 1.1) => Array.from({ length: 6 }, (_, i) => [Math.cos((i * Math.PI) / 3) * r * wide, cy + Math.sin((i * Math.PI) / 3) * r]);
    const _hn = new THREE.Vector3();
    function plate(shape, mat, depth, lift, parent) {
      const g = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: false, curveSegments: 6 });
      const p = g.attributes.position;
      for (let i = 0; i < p.count; i++) {
        const x = p.getX(i), y = p.getY(i), z = p.getZ(i), hz = hullZ(x, y), off = z < 1e-5 ? -0.015 : lift + z;
        _hn.set(x / (SX * SX), (y - CY) / (SY * SY), (hz - CZ) / (SZ * SZ)).normalize();
        p.setXYZ(i, x + _hn.x * off, y + _hn.y * off, hz + _hn.z * off);
        g.attributes.normal.setXYZ(i, _hn.x, _hn.y, _hn.z);
      }
      return mesh(g, mat, parent);
    }
    // Point on the hull in direction (nx, ny, nz) of its unit sphere, in body coordinates.
    function hullPoint(nx, ny, nz) { const l = Math.hypot(nx, ny, nz); return new THREE.Vector3((SX * nx) / l, CY + (SY * ny) / l, CZ + (SZ * nz) / l); }

    function radialTexture(stops) {
      const c = document.createElement('canvas'); c.width = c.height = 64;
      const g = c.getContext('2d'), grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
      for (const [o, col] of stops) grad.addColorStop(o, col);
      g.fillStyle = grad; g.fillRect(0, 0, 64, 64);
      return new THREE.CanvasTexture(c);
    }
    const glowTex = radialTexture([[0, 'rgba(255,255,255,1)'], [0.3, 'rgba(255,255,255,0.45)'], [1, 'rgba(255,255,255,0)']]);
    function glowSprite(size, opacity = 0.75) {
      const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: GLOW, transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false }));
      s.scale.setScalar(size);
      return s;
    }

    // ================================================================ THE WALKER
    // Egg-shaped armoured hull with one blue eye, side sensor pods, big hip drums; legs with armoured shins
    // and wheeled boots. Feet are stepped in world space and stay planted; legs are two-bone IK, knees forward.
    class Walker {
      constructor(scene) {
        this.scene = scene;
        this.root = new THREE.Group();
        this.body = new THREE.Group();
        this.shell = new THREE.Group();
        this.body.add(this.shell);
        this.root.add(this.body);
        scene.add(this.root);
        this.strips = [];
        this.buildHull(); this.buildEye(); this.buildLegs();

        this.x = 0; this.z = 0; this.h = 0; this.v = 0; this.w = 0; this.accel = 0; this.crouch = 0;
        this.t = 0; this.dist = 0; this.steps = 0; this.lean = 0; this.thump = 0; this.flash = 0; this.dip = 0;
        this.feet = [1, -1].map((side) => ({
          side, pos: new THREE.Vector3(side * STANCE_W, 0, 0), yaw: 0,
          swing: false, u: 0, T: T_SWING, from: new THREE.Vector3(), fromYaw: 0, travel: 0, lift: 0, pitch: 0,
        }));
        this.next = 0; this.sinceLand = 1;
        this.look = { x: Spring(), y: Spring() };
        this.blink = { next: 1.2, t: -1, dur: 0.18 };
        this.happy = Spring(0); this.open = Spring(1); this.wide = Spring(0); this.bright = Spring(1);
        this.saccade = { t: 0, x: 0, y: 0 }; this.lastLook = 0;
        this.onStep = () => {};
        const V = () => new THREE.Vector3();
        Object.assign(this, { _t: V(), _a: V(), _h: V(), _k: V(), _e: V(), _p: V(), _f: V(), _l: V() });
      }

      buildHull() {
        const S = this.shell;
        const hull = mesh(new THREE.SphereGeometry(1, 72, 48).scale(SX, SY, SZ), MAT.hull, S);
        hull.position.set(0, CY, CZ);
        // navy crest from the brow over the top to the back
        const crest = mesh(new THREE.SphereGeometry(1, 56, 6, -1.65, 2.6, Math.PI / 2 - 0.25, 0.5).rotateZ(-Math.PI / 2).scale(SX * 1.02, SY * 1.02, SZ * 1.02), MAT.crest, S);
        crest.position.set(0, CY, CZ);
        // face: navy frame around a hexagonal eye socket, chin plate with three vents, two swept arms
        const ring = new THREE.Shape(densify(hexPts(0.15, EYE_Y), 5));
        ring.holes.push(new THREE.Path(densify(hexPts(0.112, EYE_Y), 5)));
        plate(ring, MAT.navy, 0.022, 0.004, S);
        plate(new THREE.Shape(densify(hexPts(0.114, EYE_Y), 5)), MAT.mech, 0.012, 0.002, S);
        const c0 = EYE_Y - 0.1, c1 = EYE_Y - 0.28, cm = (c0 + c1) / 2 - 0.01;
        plate(new THREE.Shape(densify(rectPts(0, cm, 0.15, 0.11), 5)), MAT.mech, 0.008, 0, S);
        const chin = new THREE.Shape(densify([[-0.1, c0], [0.1, c0], [0.075, c1], [-0.075, c1]], 6));
        for (const x of [-0.042, 0, 0.042]) chin.holes.push(new THREE.Path(rectPts(x, cm, 0.02, 0.085).map(V2)));
        plate(chin, MAT.navy, 0.022, 0.004, S);
        for (const s of [1, -1]) {
          plate(new THREE.Shape(densify([[0.1, EYE_Y + 0.09], [0.155, EYE_Y + 0.03], [0.31, EYE_Y + 0.14], [0.25, EYE_Y + 0.22]].map(([x, y]) => [s * x, y]), 6)), MAT.navy, 0.018, 0.004, S);
          // glowing light strips low on the cheeks, in dark bezels
          plate(new THREE.Shape(densify(rectPts(s * 0.27, 0.2, 0.13, 0.05), 5)), MAT.mech, 0.01, 0.002, S);
          this.strips.push(plate(new THREE.Shape(densify(rectPts(s * 0.27, 0.2, 0.1, 0.022), 5)), MAT.glow, 0.015, 0.002, S));
          // side sensor pod (+Y of the group points outward)
          const pod = new THREE.Group(); pod.position.set(s * 0.43, CY + 0.03, 0.06); pod.rotation.z = -s * Math.PI / 2; S.add(pod);
          axle(0.125, 0.05, MAT.navy, pod, 40).position.y = 0.01;
          axle(0.105, 0.09, MAT.mech, pod, 40).position.y = 0.06;
          const bez = mesh(new THREE.TorusGeometry(0.098, 0.009, 8, 40), MAT.mech2, pod); bez.rotation.x = Math.PI / 2; bez.position.y = 0.106;
          axle(0.082, 0.03, MAT.mech2, pod, 40).position.y = 0.115;
          axle(0.052, 0.014, MAT.glass, pod, 32).position.y = 0.132;
          // hip drum under the hull, capped with a white shell and a dark concentric disc
          const hip = new THREE.Group(); hip.position.set(s * HIP_X, 0, 0); hip.rotation.z = -s * Math.PI / 2; S.add(hip);
          axle(0.1, 0.2, MAT.mech, hip, 32).position.y = -0.03;
          const cap = mesh(new THREE.SphereGeometry(0.15, 40, 16, 0, TAU, 0, Math.PI / 2), MAT.armor, hip); cap.scale.set(1, 0.72, 1); cap.position.y = 0.03;
          axle(0.09, 0.03, MAT.mech, hip, 32).position.y = 0.135;
          axle(0.056, 0.036, MAT.mech2, hip, 32).position.y = 0.15;
          axle(0.024, 0.04, MAT.navy, hip, 16).position.y = 0.16;
        }
        // screws on the panels
        for (const [x, y, z] of [[0.36, 0.62, 0.7], [0.36, -0.2, 0.91], [0.75, 0.3, 0.59], [0.62, -0.42, 0.66], [0.42, 0.5, -0.76], [0.8, -0.1, -0.5]]) {
          for (const s of [1, -1]) sphere(0.009, MAT.mech, S, 8).position.copy(hullPoint(s * x, y, z));
        }
        sphere(0.009, MAT.mech, S, 8).position.copy(hullPoint(0, 0.72, -0.69));
        // under the hull: dark core between the hips and a white crotch plate with navy trim
        rbox(0.4, 0.12, 0.26, 0.04, MAT.mech, S).position.set(0, 0.03, 0);
        rbox(0.22, 0.14, 0.22, 0.035, MAT.armor, S).position.set(0, -0.03, 0.05);
        rbox(0.13, 0.05, 0.03, 0.01, MAT.navy, S).position.set(0, -0.02, 0.165);
      }

      buildEye() {
        this.eye = new THREE.Group();
        this.eye.position.set(0, EYE_Y, hullZ(0, EYE_Y) - 0.01);
        this.shell.add(this.eye);
        const E = this.eye;
        const barrel = axle(0.09, 0.07, MAT.mech, E, 40); barrel.rotation.x = Math.PI / 2; barrel.position.z = 0.02;
        mesh(new THREE.TorusGeometry(0.087, 0.013, 10, 44), MAT.mech2, E).position.z = 0.055;
        const lens = mesh(dome(0.078), MAT.glass, E); lens.scale.z = 0.38; lens.position.z = 0.05;
        const c = document.createElement('canvas'); c.width = c.height = 128;
        this.eg = c.getContext('2d');
        this.eyeTex = new THREE.CanvasTexture(c);
        this.eyeTex.colorSpace = THREE.SRGBColorSpace;
        const iris = new THREE.Mesh(new THREE.CircleGeometry(0.068, 40), new THREE.MeshBasicMaterial({ map: this.eyeTex, transparent: true, toneMapped: false, depthWrite: false }));
        iris.position.z = 0.081;
        E.add(iris);
        this.eyeGlow = glowSprite(0.28, 0.45);
        this.eyeGlow.position.z = 0.09;
        E.add(this.eyeGlow);
      }

      buildLegs() {
        const S = this.scene;
        this.legs = [1, -1].map((side) => {
          const thigh = new THREE.Group(); S.add(thigh);                     // +Y from hip to knee
          axle(0.052, L1, MAT.mech, thigh, 18).position.y = L1 / 2;
          for (const y of [0.08, L1 - 0.08]) axle(0.066, 0.03, MAT.mech2, thigh, 18).position.y = y;
          const shin = new THREE.Group(); S.add(shin);                       // +Y from knee to ankle, +Z forward
          const knee = axle(0.06, 0.15, MAT.mech, shin, 24); knee.rotation.z = Math.PI / 2;
          const kc = axle(0.032, 0.16, MAT.steel, shin, 12); kc.rotation.z = Math.PI / 2;
          rbox(0.21, 0.27, 0.21, 0.04, MAT.armor, shin).position.set(0, L2 * 0.44, 0.02);
          const kp = rbox(0.165, 0.2, 0.045, 0.016, MAT.navy, shin); kp.position.set(0, L2 * 0.32, 0.125); kp.rotation.x = -0.14;
          const ankle = axle(0.05, 0.17, MAT.mech, shin, 18); ankle.rotation.z = Math.PI / 2; ankle.position.y = L2;
          const foot = new THREE.Group(); foot.rotation.order = 'YXZ'; S.add(foot);   // at the ankle
          const aj = axle(0.045, 0.15, MAT.mech2, foot, 18); aj.rotation.z = Math.PI / 2;
          rbox(0.19, 0.085, 0.3, 0.03, MAT.armor, foot).position.set(0, -0.055, 0.04);
          rbox(0.196, 0.014, 0.304, 0.006, MAT.mech, foot).position.set(0, -0.094, 0.04);
          const top = rbox(0.15, 0.032, 0.16, 0.012, MAT.navy, foot); top.position.set(0, -0.008, 0.085); top.rotation.x = 0.1;
          rbox(0.008, 0.05, 0.09, 0.003, MAT.mech, foot).position.set(0, -0.055, 0.155);
          for (const s of [1, -1]) for (const z of [-0.075, 0.025]) {
            const wheel = axle(0.042, 0.032, MAT.mech, foot, 18); wheel.rotation.z = Math.PI / 2; wheel.position.set(s * 0.104, -0.06, z);
            const hub = axle(0.018, 0.036, MAT.steel, foot, 10); hub.rotation.z = Math.PI / 2; hub.position.copy(wheel.position);
          }
          return { side, thigh, shin, foot };
        });
      }

      // Where a foot should land if it lifts now: ahead of where the body will be.
      target(f, lead, out) {
        const hm = this.h + this.w * lead * 0.5, hp = this.h + this.w * lead;
        const px = this.x + Math.sin(hm) * this.v * lead, pz = this.z + Math.cos(hm) * this.v * lead;
        out.set(px + Math.cos(hp) * f.side * STANCE_W, 0, pz - Math.sin(hp) * f.side * STANCE_W);
        return hp;
      }

      stepFeet(dt) {
        const moving = Math.abs(this.v) > 0.03 || Math.abs(this.w) > 0.1;
        const T = T_SWING - 0.08 * clamp((Math.abs(this.v) - WALK_V) / (HURRY_V - WALK_V), 0, 1);
        const t = this._t;
        this.sinceLand += dt;
        if (!this.feet.some((f) => f.swing) && this.sinceLand > (moving ? 0.02 : 0.14)) {
          const a = this.feet[this.next], b = this.feet[1 - this.next];
          for (const f of [a, b]) {
            const yawT = this.target(f, 1.5 * T + 0.01, t);
            const err = Math.hypot(t.x - f.pos.x, t.z - f.pos.z), yerr = Math.abs(angTo(f.yaw, yawT));
            if ((moving && f === a) || err > 0.04 || yerr > 0.18) {
              Object.assign(f, { swing: true, u: 0, T, fromYaw: f.yaw, travel: err });
              f.from.copy(f.pos);
              this.next = this.feet.indexOf(f) ^ 1;
              break;
            }
          }
        }
        for (const f of this.feet) {
          if (!f.swing) continue;
          f.u = Math.min(1, f.u + dt / f.T);
          const yawT = this.target(f, (1 - f.u) * f.T + 0.5 * f.T + 0.01, t);
          const e = f.u * f.u * (3 - 2 * f.u);
          f.pos.lerpVectors(f.from, t, e);
          f.yaw = f.fromYaw + angTo(f.fromYaw, yawT) * e;
          f.lift = LIFT * clamp(f.travel / 0.12, 0.3, 1) * Math.sin(Math.PI * Math.pow(f.u, 0.8));
          f.pitch = 0.26 * Math.sin(TAU * f.u) * clamp(f.travel / 0.16, 0, 1);
          if (f.u >= 1) {
            Object.assign(f, { swing: false, lift: 0, pitch: 0 });
            this.sinceLand = 0; this.thump = 1; this.flash = 1; this.steps++;
            this.onStep(f);
          }
        }
      }

      // Ankle in world space, raised so a pitched toe or heel never sinks into the floor.
      ankle(f, out) {
        const c = Math.cos(f.pitch), s = Math.sin(f.pitch);
        const low = Math.min(-ANKLE_H * c - TOE * s, -ANKLE_H * c + HEEL * s);
        return out.set(f.pos.x, Math.max(f.lift + ANKLE_H, -low), f.pos.z);
      }

      // c: { vt, wt, look, happy, wide, sleepy, crouch, blink }
      update(dt, c) {
        this.t += dt;
        const px = this.x, pz = this.z, vPrev = this.v;
        this.v += (c.vt - this.v) * damp(c.vt > this.v ? 2.2 : 3.5, dt);
        this.w += (c.wt - this.w) * damp(4.5, dt);
        this.h = wrap(this.h + this.w * dt);
        this.x += Math.sin(this.h) * this.v * dt;
        this.z += Math.cos(this.h) * this.v * dt;
        this.accel += ((this.v - vPrev) / Math.max(dt, 1e-3) - this.accel) * damp(8, dt);
        this.dist += Math.hypot(this.x - px, this.z - pz);
        this.crouch += ((c.crouch || 0) - this.crouch) * damp(8, dt);
        this.stepFeet(dt);
        this.poseBody(dt, c);
        this.poseLegs();
        this.poseEye(dt, c);
      }

      poseBody(dt, c) {
        let sway = 0, bob = 0, twist = 0;
        for (const f of this.feet) {
          if (!f.swing) continue;
          const s = Math.sin(Math.PI * f.u) * clamp(f.travel / 0.1, 0.3, 1);
          sway -= f.side * s; bob += s; twist -= f.side * s;
        }
        this.thump = Math.max(0, this.thump - dt * 6);
        this.dip = hump(1 - this.thump, 0, 1);
        this.lean += (clamp(0.04 * this.v / WALK_V + this.accel * 0.05, -0.08, 0.1) - this.lean) * damp(4, dt);
        this.root.position.set(this.x, 0, this.z);
        this.root.rotation.y = this.h;
        const B = this.body;
        B.position.set(sway * 0.028, PELVIS + bob * 0.026 - this.dip * 0.022 - this.crouch * 0.16 + Math.sin(this.t * 1.8) * 0.004, 0);
        B.rotation.set(this.lean, twist * 0.035, -sway * 0.045);
        this.shell.scale.set(1 + this.dip * 0.015, 1 - this.dip * 0.03, 1 + this.dip * 0.015);
        this.flash = Math.max(0, this.flash - dt * 4);
        const strip = c.sleepy ? MAT.glowDim : this.flash > 0.35 ? MAT.glowHot : MAT.glow;
        for (const s of this.strips) s.material = strip;
      }

      poseLegs() {
        const B = this.body, h = this.h;
        const fwd = this._f.set(Math.sin(h), 0, Math.cos(h)), left = this._l.set(Math.cos(h), 0, -Math.sin(h));
        this.root.updateMatrixWorld(true);
        let excess = 0;
        this.legs.forEach((L, i) => {
          const hip = B.localToWorld(this._h.set(L.side * HIP_X, 0, 0));
          excess = Math.max(excess, hip.distanceTo(this.ankle(this.feet[i], this._a)) - (L1 + L2 - 0.004));
        });
        if (excess > 0) { B.position.y -= excess; this.root.updateMatrixWorld(true); }
        this.legs.forEach((L, i) => {
          const f = this.feet[i];
          const H = B.localToWorld(this._h.set(L.side * HIP_X, 0, 0));
          const A = this.ankle(f, this._a);
          const e1 = this._e.subVectors(A, H); const d0 = e1.length(); e1.divideScalar(d0 || 1);
          const dc = clamp(d0, Math.abs(L1 - L2) + 1e-3, L1 + L2 - 1e-3);
          const e2 = this._p.copy(fwd).addScaledVector(left, L.side * 0.08);          // knees forward, a touch outward
          e2.addScaledVector(e1, -e2.dot(e1)).normalize();
          const a = Math.acos(clamp((L1 * L1 + dc * dc - L2 * L2) / (2 * L1 * dc), -1, 1));
          const K = this._k.copy(H).addScaledVector(e1, Math.cos(a) * L1).addScaledVector(e2, Math.sin(a) * L1);
          const end = this._t.copy(H).addScaledVector(e1, dc);
          aimBasis(L.thigh, H, K, fwd);
          aimBasis(L.shin, K, end, fwd);
          L.foot.position.copy(A);
          L.foot.rotation.set(f.pitch, f.yaw, 0);
        });
      }

      poseEye(dt, c) {
        let lx = 0, ly = 0;
        if (c.look) {
          const dx = c.look.x - this.x, dz = c.look.z - this.z;
          lx = clamp(angTo(this.h, Math.atan2(dx, dz)) / 1.1, -1, 1);
          ly = clamp(Math.atan2(c.look.y - (PELVIS + EYE_Y), Math.hypot(dx, dz)) / 0.6, -1, 1);
        }
        const bl = this.blink;
        if ((c.blink || Math.abs(lx - this.lastLook) > 0.6) && bl.t < 0) bl.next = 0;     // big glances come with a blink
        this.lastLook = lx;
        bl.next -= dt;
        if (bl.next <= 0 && bl.t < 0) { bl.t = 0; bl.dur = Math.random() < 0.22 ? 0.46 : 0.18; bl.next = 2.2 + Math.random() * 3.5; }
        let close = 0;
        if (bl.t >= 0) {
          bl.t += dt;
          close = bl.dur > 0.3 ? Math.max(hump(bl.t, 0, 0.18), hump(bl.t, 0.26, 0.44)) : hump(bl.t, 0, 0.18);
          if (bl.t >= bl.dur) bl.t = -1;
        }
        const S = this.saccade;
        S.t -= dt;
        if (S.t <= 0) { S.t = 0.5 + Math.random() * 1.5; S.x = (Math.random() - 0.5) * 0.25; S.y = (Math.random() - 0.5) * 0.2; }
        const ex = spring(this.look.x, lx + S.x, dt, 90, 13), ey = spring(this.look.y, ly + S.y, dt, 90, 13);
        this.eye.rotation.set(-ey * 0.22, ex * 0.32, 0);       // the whole lens barrel turns to look
        const hap = spring(this.happy, c.happy ? 1 : 0, dt, 60, 12);
        const wide = spring(this.wide, c.wide ? 1 : 0, dt, 60, 10);
        const open = spring(this.open, c.sleepy ? 0.1 : 1, dt, 40, 10);
        const bright = spring(this.bright, c.sleepy ? 0.25 : 1, dt, 30, 10);
        this.eyeGlow.material.opacity = 0.45 * bright * (1 - close * 0.8);
        this.drawEye(ex, ey, Math.max(0.06, open * (1 - close * 0.95)), hap, wide, bright);
      }

      drawEye(lx, ly, open, happy, wide, bright) {
        const g = this.eg;
        g.clearRect(0, 0, 128, 128);
        g.save();
        g.globalAlpha = 0.3 + 0.7 * bright;
        const cx = 64 + clamp(lx, -1.2, 1.2) * 9, cy = 64 - clamp(ly, -1.2, 1.2) * 9;
        if (happy > 0.5) {
          g.strokeStyle = '#a9ecff'; g.lineWidth = 15; g.lineCap = 'round';
          g.shadowColor = 'rgba(76, 200, 255, 1)'; g.shadowBlur = 16;
          g.beginPath(); g.arc(cx, cy + 20, 30, Math.PI * 1.15, Math.PI * 1.85); g.stroke();
        } else {
          const r = 31 * (1 + wide * 0.12);
          g.translate(cx, cy); g.scale(1, open);
          const grad = g.createRadialGradient(0, 0, 0, 0, 0, r);
          grad.addColorStop(0, '#ffffff'); grad.addColorStop(0.28, '#c4f2ff'); grad.addColorStop(0.62, '#4cc8ff'); grad.addColorStop(1, 'rgba(76, 200, 255, 0)');
          g.fillStyle = grad; g.beginPath(); g.arc(0, 0, r, 0, TAU); g.fill();
          g.strokeStyle = 'rgba(76, 200, 255, 0.75)'; g.lineWidth = 3;
          g.beginPath(); g.arc(0, 0, r * 1.5, 0, TAU); g.stroke();
        }
        g.restore();
        this.eyeTex.needsUpdate = true;
      }
    }

    // ================================================================ DRONES
    // Round white scouts with a navy cap, one blue eye and a slow two-bladed rotor on each side.
    class Drone {
      constructor(scene, i) {
        this.i = i;
        this.g = new THREE.Group(); this.g.scale.setScalar(1.3); scene.add(this.g);
        this.tilt = new THREE.Group(); this.g.add(this.tilt);
        const T = this.tilt;
        sphere(0.105, MAT.armor, T, 36);
        const cap = mesh(new THREE.SphereGeometry(0.108, 36, 12, 0, TAU, 0, 0.95), MAT.navy, T); cap.rotation.x = -0.8;
        const seam = mesh(new THREE.TorusGeometry(0.105, 0.005, 6, 48), MAT.mech, T); seam.rotation.y = Math.PI / 2;
        const eye = new THREE.Group(); eye.position.z = 0.078; T.add(eye);
        const barrel = axle(0.056, 0.05, MAT.mech, eye, 32); barrel.rotation.x = Math.PI / 2; barrel.position.z = 0.012;
        mesh(new THREE.TorusGeometry(0.056, 0.009, 8, 36), MAT.navy, eye).position.z = 0.036;
        const lens = mesh(dome(0.048), MAT.glass, eye); lens.scale.z = 0.4; lens.position.z = 0.034;
        this.iris = new THREE.Mesh(new THREE.CircleGeometry(0.024, 28), MAT.glow.clone());
        this.iris.position.z = 0.055;
        eye.add(this.iris);
        this.glow = glowSprite(0.2, 0.6); this.glow.position.z = 0.065; eye.add(this.glow);
        this.rotors = [1, -1].map((s) => {
          const hub = axle(0.026, 0.06, MAT.navy, T, 18); hub.rotation.z = Math.PI / 2; hub.position.x = s * 0.112;
          const r = new THREE.Group(); r.position.x = s * 0.148; T.add(r);
          axle(0.02, 0.02, MAT.mech2, r, 14).rotation.z = Math.PI / 2;
          for (const b of [0, Math.PI]) {
            const blade = new THREE.Group(); blade.rotation.x = b; r.add(blade);
            const paddle = rbox(0.016, 0.15, 0.052, 0.008, MAT.mech, blade, 2); paddle.position.y = 0.09; paddle.rotation.y = s * 0.25;
            const strip = new THREE.Mesh(new THREE.BoxGeometry(0.005, 0.09, 0.014), MAT.glow); strip.position.set(s * 0.01, 0.1, 0); blade.add(strip);
          }
          return r;
        });
        this.pos = new THREE.Vector3(); this.vel = new THREE.Vector3(); this.yaw = 0; this.spin = 10;
        this.blink = 0; this.nextBlink = 1 + Math.random() * 3; this.phase = Math.random() * TAU; this.roll = 0;
        this.blob = blob(0.42, 0.4);
      }

      // target: where to hover, look: what to face, mood: { landed, happy, roll }
      update(dt, target, look, mood) {
        const k = mood.landed ? 5 : 6, c = 4.2;
        this.vel.x += ((target.x - this.pos.x) * k - this.vel.x * c) * dt;
        this.vel.y += ((target.y - this.pos.y) * k - this.vel.y * c) * dt;
        this.vel.z += ((target.z - this.pos.z) * k - this.vel.z * c) * dt;
        this.pos.addScaledVector(this.vel, dt);
        if (this.pos.y < 0.145) { this.pos.y = 0.145; this.vel.y = Math.max(0, this.vel.y); }
        const hover = mood.landed ? 0 : Math.sin(pip.t * 2.2 + this.phase) * 0.025;
        this.g.position.set(this.pos.x, this.pos.y + hover, this.pos.z);
        const want = Math.atan2(look.x - this.pos.x, look.z - this.pos.z);
        this.yaw = wrap(this.yaw + angTo(this.yaw, want) * damp(4, dt));
        this.g.rotation.y = this.yaw;
        const sy = Math.sin(this.yaw), cy = Math.cos(this.yaw);
        const fwd = this.vel.x * sy + this.vel.z * cy, lat = this.vel.x * cy - this.vel.z * sy;
        this.roll += ((mood.roll || 0) - this.roll) * damp(10, dt);
        this.tilt.rotation.set(clamp(fwd * 0.45, -0.4, 0.4), 0, clamp(-lat * 0.45, -0.4, 0.4) + this.roll);
        this.spin += ((mood.landed ? 0 : 11 + this.vel.length() * 6) - this.spin) * damp(2, dt);
        this.rotors.forEach((r, j) => { r.rotation.x += (j ? -1 : 1) * this.spin * dt; });
        this.nextBlink -= dt;
        if (this.nextBlink <= 0) { this.blink = 0.16; this.nextBlink = 2 + Math.random() * 4; }
        this.blink = Math.max(0, this.blink - dt);
        const lit = mood.landed ? 0.3 : 1;
        this.iris.scale.set(mood.happy ? 1.2 : 1, (this.blink > 0 ? 0.15 : 1) * (mood.happy ? 0.55 : 1), 1);
        this.iris.material.color.copy(GLOW).multiplyScalar(0.35 + 0.65 * lit);
        this.glow.material.opacity = 0.6 * lit;
        const alt = this.pos.y;
        this.blob.position.set(this.pos.x, 0.001, this.pos.z);
        this.blob.scale.setScalar(0.24 + alt * 0.12);
        this.blob.material.opacity = 0.4 / (1 + alt * 1.5);
      }
    }

    // ================================================================ scene: endless white floor, soft studio light
    const canvas = $('#world');
    const coarse = matchMedia('(pointer: coarse)').matches;
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.toneMapping = THREE.NeutralToneMapping;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    scene.background = WHITE.clone();
    scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
    scene.environmentIntensity = 0.6;
    const camera = new THREE.PerspectiveCamera(30, 1, 0.05, 300);

    scene.add(new THREE.HemisphereLight(0xffffff, 0xdedcd6, 1.3));
    const key = new THREE.DirectionalLight(0xfff4e8, 2.2);
    key.castShadow = true;
    key.shadow.mapSize.setScalar(coarse ? 2048 : 4096);
    Object.assign(key.shadow.camera, { left: -4.5, right: 4.5, top: 4.5, bottom: -4.5, near: 0.5, far: 20 });
    key.shadow.camera.updateProjectionMatrix();
    key.shadow.bias = -0.0005; key.shadow.normalBias = 0.02;
    scene.add(key, key.target);

    // the floor is the background colour, unlit, so it runs to infinity with no horizon; shadows land on a sheet above it
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(600, 600).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: WHITE, toneMapped: false }));
    scene.add(floor);
    const shadowFloor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40).rotateX(-Math.PI / 2), new THREE.ShadowMaterial({ opacity: 0.13 }));
    shadowFloor.position.y = 0.0005; shadowFloor.receiveShadow = true;
    scene.add(shadowFloor);

    const blobTex = radialTexture([[0, 'rgba(0,0,0,0.55)'], [1, 'rgba(0,0,0,0)']]);
    const blobGeo = new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2);
    function blob(size, opacity) {
      const m = new THREE.Mesh(blobGeo, new THREE.MeshBasicMaterial({ map: blobTex, transparent: true, opacity, depthWrite: false }));
      m.scale.setScalar(size); m.position.y = 0.001; m.renderOrder = 1;
      scene.add(m);
      return m;
    }

    // ================================================================ footprints, rings, goal flag
    function printTexture() {
      const c = document.createElement('canvas'); c.width = 64; c.height = 128;
      const g = c.getContext('2d');
      const rr = (x, y, w, h, r) => { g.beginPath(); g.roundRect(x, y, w, h, r); g.fill(); };
      g.fillStyle = '#fff';
      g.globalAlpha = 0.3; rr(4, 4, 56, 120, 14);
      g.globalAlpha = 1;
      for (let i = 0; i < 6; i++) rr(12, 14 + i * 18, 40, 8, 3);   // tread bars; toe at the bottom of the canvas = forward
      return new THREE.CanvasTexture(c);
    }
    const printTex = printTexture(), printGeo = new THREE.PlaneGeometry(0.19, 0.3).rotateX(-Math.PI / 2);
    const prints = Array.from({ length: 90 }, () => {
      const m = new THREE.Mesh(printGeo, new THREE.MeshBasicMaterial({ color: INK, map: printTex, transparent: true, opacity: 0, depthWrite: false }));
      m.visible = false; m.renderOrder = 2; m.position.y = 0.002;
      scene.add(m);
      return { m, age: 99 };
    });
    let printI = 0;
    const PRINT_LIFE = 20;

    const rings = [], ringGeo = new THREE.RingGeometry(0.93, 1, 72).rotateX(-Math.PI / 2);
    function ring(x, z, { r0 = 0.05, r1 = 0.3, dur = 0.6, color = INK, opacity = 0.2 } = {}) {
      const m = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color, transparent: true, depthWrite: false, opacity }));
      m.position.set(x, 0.003, z); m.renderOrder = 3;
      scene.add(m);
      rings.push({ m, t: 0, r0, r1, dur, opacity });
    }

    const flag = new THREE.Group();
    {
      const pole = axle(0.009, 0.5, MAT.mech, flag, 8); pole.position.y = 0.25;
      const shape = new THREE.Shape(); shape.moveTo(0, 0); shape.lineTo(0.18, -0.048); shape.lineTo(0, -0.096); shape.closePath();
      const cloth = new THREE.Mesh(new THREE.ShapeGeometry(shape), new THREE.MeshStandardMaterial({ color: ACCENT, roughness: 0.6, side: THREE.DoubleSide }));
      cloth.castShadow = true;
      const hinge = new THREE.Group(); hinge.position.y = 0.5; hinge.add(cloth); flag.add(hinge);
      flag.userData = { hinge, t: 0 };
      flag.visible = false;
      scene.add(flag);
    }

    // ================================================================ the walker and its drones
    const pip = new Walker(scene);
    const pipBlob = blob(1.1, 0.28);
    pip.onStep = (f) => {
      const P = prints[printI++ % prints.length];
      P.age = 0;
      P.m.position.set(f.pos.x + Math.sin(f.yaw) * 0.04, 0.002, f.pos.z + Math.cos(f.yaw) * 0.04);
      P.m.rotation.y = f.yaw;
      P.m.visible = true;
      if (f.travel > 0.05) ring(f.pos.x, f.pos.z + Math.cos(f.yaw) * 0.03, { r0: 0.08, r1: 0.26, dur: 0.5, opacity: 0.08 });
    };
    const drones = [0, 1, 2].map((i) => new Drone(scene, i));
    drones.forEach((d, i) => { d.pos.set(Math.cos(i * 2.1) * 1.1, 1.4, Math.sin(i * 2.1) * 1.1); });

    // ================================================================ what happens next (a small state machine, nothing learned)
    const LABEL = { walk: 'On patrol', look: 'Scanning around', hi: 'Saying hi', doze: 'Powering down', goto: 'Heading to your marker' };
    const D = { state: 'walk', t: 0, dur: 9, phase: 0, pace: 1, h0: 0, goal: new THREE.Vector3(), t0: 0, clock: 0 };
    const wander = [Math.random() * TAU, Math.random() * TAU];
    const lookAt = new THREE.Vector3(), _cam = new THREE.Vector3();
    function setState(state, extra = {}) {
      Object.assign(D, { state, t: 0, phase: 0, h0: pip.h }, extra);
      if (state === 'walk') D.pace = 0.88 + Math.random() * 0.24;
    }
    function ahead(dist, y, yaw = 0) { const hh = pip.h + yaw; return lookAt.set(pip.x + Math.sin(hh) * dist, y, pip.z + Math.cos(hh) * dist); }
    const headingTo = (x, z) => Math.atan2(x - pip.x, z - pip.z);

    function think(dt) {
      D.t += dt; D.clock += dt;
      const c = { vt: 0, wt: 0, look: null, happy: false, wide: false, sleepy: false, crouch: 0, blink: false };
      if (D.state === 'walk') {
        // gentle meander: two slow sine waves on the turn rate
        c.wt = 0.26 * Math.sin(D.clock * 0.21 + wander[0]) + 0.17 * Math.sin(D.clock * 0.53 + wander[1]);
        c.vt = WALK_V * D.pace;
        const scout = swarm.scout && drones[swarm.scout.i];
        c.look = scout ? lookAt.copy(scout.pos) : ahead(3, 0.7, 0.35 * Math.sin(D.clock * 0.7));
        if (D.t > D.dur) {
          const r = Math.random();
          if (r < 0.25) setState('look'); else if (r < 0.43) setState('hi'); else if (r < 0.5) setState('doze'); else setState('walk', { dur: 7 + Math.random() * 8 });
        }
      } else if (D.state === 'look') {
        const k = D.t;
        const tgt = k < 1.8 ? D.h0 + 0.75 : k < 3.6 ? D.h0 - 0.6 : D.h0;
        c.wt = clamp(angTo(pip.h, tgt) * 2.2, -0.9, 0.9);
        c.look = ahead(3, 1.2, k < 1.8 ? 0.7 : k < 3.6 ? -0.7 : 0);
        c.wide = true;
        if (k > 4.6) setState('walk', { dur: 6 + Math.random() * 6 });
      } else if (D.state === 'hi') {
        const want = headingTo(camera.position.x, camera.position.z), err = angTo(pip.h, want);
        c.look = camera.position;
        if (D.phase === 0) {
          c.wt = clamp(err * 2.6, -1.2, 1.2);
          if (Math.abs(err) < 0.25 || D.t > 2.4) { D.phase = 1; D.t0 = D.t; c.blink = true; }
        } else {
          const k = D.t - D.t0;
          c.wt = clamp(err * 2, -0.7, 0.7);
          c.happy = true;
          c.crouch = 0.4 * (0.5 - 0.5 * Math.cos(TAU * clamp(k / 0.6, 0, 3)));   // three little bounces
          if (k > 2.8) setState('walk', { dur: 6 + Math.random() * 6 });
        }
      } else if (D.state === 'doze') {
        c.crouch = D.t > 0.3 && D.t < 6.2 ? 1 : 0;
        c.sleepy = D.t > 0.9 && D.t < 6;
        c.look = ahead(2, 0);
        if (D.t > 6.8) setState('walk', { dur: 6 + Math.random() * 6 });
      } else if (D.state === 'goto') {
        const gx = D.goal.x - pip.x, gz = D.goal.z - pip.z, gd = Math.hypot(gx, gz);
        c.wt = clamp(angTo(pip.h, Math.atan2(gx, gz)) * 1.8, -1.1, 1.1);
        c.vt = HURRY_V * clamp(gd / 0.6, 0.3, 1) * (1 - 0.5 * Math.min(1, Math.abs(c.wt)));
        c.look = lookAt.set(D.goal.x, 0.3, D.goal.z);
        if (gd < 0.2) { ring(D.goal.x, D.goal.z, { r0: 0.14, r1: 0.6, dur: 0.7, color: ACCENT, opacity: 0.5 }); flag.visible = false; setState('hi'); }
      }
      return c;
    }

    // Drones escort in a loose ring; now and then one flies out to scan a patch of floor; one flies ahead to your
    // marker; they flank Pip and roll when it says hi, and land around it when it powers down.
    const swarm = { t: 0, scout: null, nextScout: 4 };
    const _dt = new THREE.Vector3(), _dl = new THREE.Vector3();
    function updateDrones(dt, c) {
      swarm.t += dt;
      const t = swarm.t;
      const landed = D.state === 'doze' && D.t > 0.8 && D.t < 6.2;
      const hi = D.state === 'hi' && D.phase === 1;
      swarm.nextScout -= dt;
      if (!swarm.scout && swarm.nextScout <= 0 && D.state === 'walk') {
        const a = pip.h + (Math.random() < 0.5 ? 1 : -1) * (0.5 + Math.random() * 0.8), r = 2.4 + Math.random() * 1.2;
        const x = pip.x + Math.sin(a) * r + Math.sin(pip.h) * pip.v * 2, z = pip.z + Math.cos(a) * r + Math.cos(pip.h) * pip.v * 2;
        swarm.scout = { i: (Math.random() * 3) | 0, x, z, until: t + 3.8, pinged: false };
        swarm.nextScout = 6 + Math.random() * 7;
      }
      if (swarm.scout && (t > swarm.scout.until || D.state !== 'walk')) swarm.scout = null;
      drones.forEach((d, i) => {
        let look = c.look || ahead(3, 0.7);
        const mood = { landed, happy: hi, roll: 0 };
        if (landed) {
          const a = pip.h + [1.9, Math.PI, -1.9][i];
          _dt.set(pip.x + Math.sin(a) * 0.85, 0.145, pip.z + Math.cos(a) * 0.85);
          look = _dl.set(pip.x, 0.8, pip.z);
        } else if (hi) {
          const k = D.t - D.t0, side = i - 1;
          const s = Math.sin(pip.h), co = Math.cos(pip.h);
          _dt.set(pip.x + s * 0.3 + co * side * 0.9, 1.35 + (side === 0 ? 0.35 : 0), pip.z + co * 0.3 - s * side * 0.9);
          look = camera.position;
          const r = clamp((k - 0.25 - i * 0.3) / 0.7, 0, 1);
          mood.roll = r * r * (3 - 2 * r) * TAU;                                      // a barrel roll each, one after the other
        } else if (D.state === 'goto' && i === 0) {
          _dt.set(D.goal.x, 0.95, D.goal.z);
          look = _dl.set(pip.x, 0.8, pip.z);
        } else if (swarm.scout && swarm.scout.i === i) {
          const S = swarm.scout, a = t * 1.8;
          _dt.set(S.x + Math.sin(a) * 0.3, 0.7, S.z + Math.cos(a) * 0.3);
          look = _dl.set(S.x, 0, S.z);
          if (!S.pinged && Math.hypot(d.pos.x - S.x, d.pos.z - S.z) < 0.6) { S.pinged = true; ring(S.x, S.z, { r0: 0.1, r1: 0.8, dur: 1.2, color: GLOW, opacity: 0.7 }); }
        } else {
          const a = pip.h + [0.95, Math.PI, -0.95][i] + 0.25 * Math.sin(t * 0.4 + i * 2);
          const r = 1.1 + 0.12 * Math.sin(t * 0.7 + i * 2);
          _dt.set(pip.x + Math.sin(a) * r, 1.4 + 0.12 * Math.sin(t * 0.9 + i * 1.7) + (i === 1 ? 0.12 : 0), pip.z + Math.cos(a) * r);
        }
        // keep clear of each other
        for (const o of drones) {
          if (o === d) continue;
          const dx = d.pos.x - o.pos.x, dy = d.pos.y - o.pos.y, dz = d.pos.z - o.pos.z, dd = Math.hypot(dx, dy, dz);
          if (dd < 0.55 && dd > 1e-3) { const p = ((0.55 - dd) / dd) * 2.5; _dt.x += dx * p; _dt.y += dy * p; _dt.z += dz * p; }
        }
        d.update(dt, _dt, look, mood);
      });
    }

    function sendTo(x, z) {
      D.goal.set(x, 0, z);
      setState('goto');
      flag.position.set(x, 0, z); flag.visible = true; flag.userData.t = 0;
      ring(x, z, { r0: 0.05, r1: 0.35, dur: 0.5, color: ACCENT, opacity: 0.5 });
    }

    // ================================================================ camera: perspective, orbits around Pip between shots
    const SHOT = {
      follow: { az: Math.PI + 0.35, dist: 6.8, y: 2.9, la: 0.8, ly: 0.85 },
      front: { az: 0.45, dist: 6.2, y: 1.45, la: 0.1, ly: 1.0 },
      side: { az: Math.PI / 2 - 0.25, dist: 6.4, y: 1.5, la: 0.5, ly: 0.9 },
    };
    const AUTO = [['follow', 12], ['front', 8], ['follow', 9], ['side', 7]];
    const cam = { mode: 'auto', i: 0, t: 0, heading: 0, ...SHOT.follow, zoom: 1, zoomT: 1, cx: 0, cz: 0 };
    const _look = new THREE.Vector3();
    function updateCamera(dt, snap = false) {
      let shot = cam.mode;
      if (shot === 'auto') {
        cam.t += dt;
        if (cam.t > AUTO[cam.i][1]) { cam.i = (cam.i + 1) % AUTO.length; cam.t = 0; }
        shot = AUTO[cam.i][0];
        if (D.state === 'hi' || D.state === 'doze') shot = 'front';
      }
      const S = SHOT[shot];
      if (D.state !== 'hi') cam.heading = wrap(cam.heading + angTo(cam.heading, pip.h) * (snap ? 1 : damp(0.9, dt)));
      const k = snap ? 1 : damp(1.3, dt);
      cam.az = wrap(cam.az + angTo(cam.az, S.az) * k);
      cam.dist += (S.dist - cam.dist) * k; cam.y += (S.y - cam.y) * k; cam.la += (S.la - cam.la) * k; cam.ly += (S.ly - cam.ly) * k;
      cam.zoom += (cam.zoomT - cam.zoom) * (snap ? 1 : damp(6, dt));
      const kc = snap ? 1 : damp(4, dt);
      cam.cx += (pip.x - cam.cx) * kc; cam.cz += (pip.z - cam.cz) * kc;
      const A = cam.heading + cam.az, H = cam.heading, z = cam.zoom;
      camera.position.set(cam.cx + Math.sin(A) * cam.dist * z, 0.2 + (cam.y - 0.2) * z, cam.cz + Math.cos(A) * cam.dist * z);
      camera.lookAt(_look.set(cam.cx + Math.sin(H) * cam.la, cam.ly, cam.cz + Math.cos(H) * cam.la));
      key.position.set(pip.x + 3.2, 6.5, pip.z + 2.6);
      key.target.position.set(pip.x, 0, pip.z);
      shadowFloor.position.x = Math.round(pip.x / 10) * 10; shadowFloor.position.z = Math.round(pip.z / 10) * 10;
      floor.position.x = Math.round(pip.x / 50) * 50; floor.position.z = Math.round(pip.z / 50) * 50;
    }
    function setCam(mode) {
      cam.mode = mode; cam.t = 0;
      document.querySelectorAll('[data-cam]').forEach((b) => { b.classList.toggle('on', b.dataset.cam === mode); b.setAttribute('aria-pressed', String(b.dataset.cam === mode)); });
    }

    // ================================================================ per-frame effects
    function updateFx(dt) {
      for (const P of prints) {
        if (P.age > PRINT_LIFE) continue;
        P.age += dt;
        P.m.material.opacity = 0.14 * (1 - Math.min(1, P.age / PRINT_LIFE));
        P.m.visible = P.age < PRINT_LIFE;
      }
      for (let i = rings.length - 1; i >= 0; i--) {
        const r = rings[i];
        r.t += dt / r.dur;
        const e = 1 - Math.pow(1 - Math.min(1, r.t), 3);
        r.m.scale.setScalar(r.r0 + (r.r1 - r.r0) * e);
        r.m.material.opacity = r.opacity * (1 - Math.min(1, r.t));
        if (r.t >= 1) { scene.remove(r.m); r.m.material.dispose(); rings.splice(i, 1); }
      }
      pipBlob.position.set(pip.x, 0.001, pip.z);
      if (flag.visible) {
        const F = flag.userData;
        F.t += dt;
        F.hinge.rotation.y = Math.sin(F.t * 5) * 0.25;
      }
    }

    // ================================================================ UI
    let paused = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const PLAY = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 2.8v10.4L13 8z" fill="currentColor"/></svg><span>Play</span>';
    const PAUSE = '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="2.8" width="3.2" height="10.4" rx="1" fill="currentColor"/><rect x="9.3" y="2.8" width="3.2" height="10.4" rx="1" fill="currentColor"/></svg><span>Pause</span>';
    function setPaused(p) {
      paused = p;
      const b = $('#btn-play');
      b.innerHTML = p ? PLAY : PAUSE;
      b.setAttribute('aria-label', p ? 'Play' : 'Pause');
      showStatus();
    }
    function sayHi() { if (D.state !== 'hi') setState('hi'); if (paused) setPaused(false); }
    function showStatus() {
      $('#doing').textContent = paused ? 'Paused' : LABEL[D.state];
      $('#st-steps').textContent = pip.steps.toLocaleString();
      $('#st-dist').textContent = pip.dist < 100 ? pip.dist.toFixed(1) : Math.round(pip.dist).toLocaleString();
      const s = Math.floor(D.clock);
      $('#st-time').textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    }
    let hintGone = false;
    function hideHint() { if (!hintGone) { hintGone = true; $('#hint')?.classList.add('gone'); } }
    if (coarse) $('#hint-verb').textContent = 'Tap';
    setTimeout(hideHint, 14000);

    $('#btn-play').addEventListener('click', () => setPaused(!paused));
    $('#btn-hi').addEventListener('click', sayHi);
    document.querySelectorAll('[data-cam]').forEach((b) => b.addEventListener('click', () => setCam(b.dataset.cam)));
    canvas.addEventListener('wheel', (e) => { e.preventDefault(); cam.zoomT = clamp(cam.zoomT * Math.exp(e.deltaY * 0.0012), 0.55, 2.2); }, { passive: false });

    const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), hit = new THREE.Vector3(), ground = new THREE.Plane(UP, 0);
    canvas.addEventListener('click', (e) => {
      const r = canvas.getBoundingClientRect();
      ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
      ray.setFromCamera(ndc, camera);
      if (!ray.ray.intersectPlane(ground, hit) || Math.hypot(hit.x - pip.x, hit.z - pip.z) > 16) return;
      sendTo(hit.x, hit.z);
      hideHint();
      if (paused) setPaused(false);
    });
    addEventListener('keydown', (e) => {
      if (e.target.closest?.('button') && (e.key === ' ' || e.key === 'Enter')) return;
      const k = e.key.toLowerCase();
      if (k === ' ' || k === 'p') { e.preventDefault(); setPaused(!paused); }
      else if (k === 'w') sayHi();
      else if (k === 'c') { const order = ['auto', 'follow', 'front', 'side']; setCam(order[(order.indexOf(cam.mode) + 1) % order.length]); }
      else if (k === 'h') document.body.classList.toggle('rec');
    });

    function resize() {
      const w = canvas.clientWidth, h = canvas.clientHeight;
      if (!w || !h) return;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.fov = w / h < 0.8 ? 44 : 30;             // phones in portrait: widen so Pip and the drones fit
      camera.updateProjectionMatrix();
    }
    addEventListener('resize', resize);
    resize();

    // ================================================================ loop
    let last = performance.now(), hud = 0;
    function step(dt) {
      const c = think(dt);
      pip.update(dt, c);
      updateDrones(dt, c);
      updateFx(dt);
    }
    function frame(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      if (!paused) step(dt);
      updateCamera(dt);
      hud -= dt;
      if (hud <= 0) { hud = 0.2; showStatus(); }
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }

    for (let i = 0; i < 30; i++) { const c = { vt: 0, wt: 0 }; pip.update(1 / 60, c); updateDrones(1 / 60, c); }
    updateCamera(0, true);
    setPaused(paused);
    setCam('auto');
    renderer.render(scene, camera);
    $('#loader').classList.add('gone');
    window.pip = { pip, drones, D, cam, setState, setCam, sendTo, sayHi, setPaused, step, updateCamera, render: () => renderer.render(scene, camera) };
    requestAnimationFrame((t) => { last = t; frame(t); });
  </script>
</body>
</html>
