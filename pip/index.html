<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Pip the Walker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    /* Layout: full-bleed isometric terrain map; name top-left, status card top-right, dark control dock bottom-centre.
       Light only by design: the map is paper, sage and water, with ink grid crosses and one orange accent. */
    :root {
      --paper: #ece7dc;
      --card: rgba(255, 255, 255, 0.92);
      --ink: #2a2c29;
      --dim: #75746c;
      --hair: rgba(42, 44, 41, 0.1);
      --accent: #E55B2B;
      --dock: #232522;
      --dock-fg: #f3f0e8;
      --dock-dim: rgba(243, 240, 232, 0.45);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.05), 0 18px 44px rgba(42, 44, 41, 0.12);
      --sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      --mono: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
      color-scheme: light;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 15px; overflow: hidden; -webkit-font-smoothing: antialiased; font-feature-settings: "tnum" 1, "cv11" 1; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    kbd { font-family: var(--mono); font-size: 11px; font-weight: 400; }

    #world { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: manipulation; }

    #top { position: fixed; left: 40px; top: calc(30px + env(safe-area-inset-top, 0px)); pointer-events: none; }
    #top h1, #loader h1 { font-weight: 700; font-size: 56px; line-height: 1; letter-spacing: -0.045em; }
    #top h1 em, #loader h1 em { color: var(--accent); font-style: normal; }
    #top p { margin-top: 10px; font-size: 15px; font-weight: 500; color: var(--dim); }

    .card { background: var(--card); border: 1px solid var(--hair); border-radius: 18px; box-shadow: var(--shadow); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
    .kicker { font-size: 11.5px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }

    #status { position: fixed; right: 40px; top: calc(36px + env(safe-area-inset-top, 0px)); width: 300px; padding: 16px 18px 15px; pointer-events: none; }
    #doing { margin-top: 8px; font-size: 26px; font-weight: 700; line-height: 1.1; letter-spacing: -0.035em; text-wrap: balance; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--hair); }
    .stats b { display: block; font-size: 20px; font-weight: 700; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .stats span { display: block; margin-top: 5px; font-size: 11.5px; color: var(--dim); }

    #hint {
      position: fixed; left: 50%; bottom: calc(108px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
      padding: 8px 15px; border-radius: 999px; background: var(--card); box-shadow: var(--shadow);
      font-size: 13.5px; color: var(--dim); white-space: nowrap; pointer-events: none; transition: opacity 0.6s ease;
    }
    #hint b { color: var(--ink); font-weight: 600; }
    #hint.gone { opacity: 0; }

    #dock {
      position: fixed; left: 50%; bottom: calc(32px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
      display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px; padding: 8px;
      width: max-content; max-width: calc(100vw - 32px); background: var(--dock); border-radius: 22px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12), 0 20px 44px rgba(0, 0, 0, 0.22);
    }
    #dock .group { display: flex; align-items: center; gap: 4px; }
    #dock .sep { width: 1px; height: 30px; background: rgba(255, 255, 255, 0.14); margin: 0 8px; }
    #dock .glabel { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dock-dim); margin: 0 6px 0 4px; }
    .dbtn {
      height: 52px; padding: 0 18px; border-radius: 14px; color: var(--dock-fg);
      display: flex; align-items: center; justify-content: center; gap: 10px;
      font-size: 17px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap;
      transition: background 0.18s, color 0.18s;
    }
    .dbtn:hover { background: rgba(255, 255, 255, 0.09); }
    .dbtn:active { background: rgba(255, 255, 255, 0.16); }
    .dbtn svg { width: 16px; height: 16px; flex: none; }
    .dbtn.icon { width: 52px; padding: 0; }
    .dbtn.icon svg { width: 19px; height: 19px; }
    .dbtn.flip svg { transform: scaleX(-1); }
    .dbtn.play { background: var(--accent); color: #fff; padding: 0 22px 0 18px; }
    .dbtn.play:hover { background: #ef6a3b; }
    .dbtn kbd { margin-left: 2px; color: var(--dock-dim); border: 1px solid rgba(255, 255, 255, 0.16); border-radius: 5px; padding: 1px 6px; }

    #loader { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: var(--paper); transition: opacity 0.8s ease; }
    #loader.gone { opacity: 0; pointer-events: none; }
    #loader .ld { font-size: 14px; color: var(--dim); }

    body.rec #dock, body.rec #hint { opacity: 0; pointer-events: none; }

    @media (max-width: 1150px) {
      #top { left: 24px; top: calc(20px + env(safe-area-inset-top, 0px)); }
      #top h1 { font-size: 40px; }
      #status { right: 24px; top: calc(22px + env(safe-area-inset-top, 0px)); width: 270px; padding: 13px 15px; }
      #doing { font-size: 22px; }
      .dbtn { height: 46px; padding: 0 14px; font-size: 15px; }
      .dbtn.icon { width: 46px; }
      .dbtn kbd { display: none; }
    }
    @media (max-width: 720px) {
      #top { left: 16px; top: calc(14px + env(safe-area-inset-top, 0px)); }
      #top h1 { font-size: 34px; }
      #top p { display: none; }
      #status { left: 16px; right: auto; top: calc(58px + env(safe-area-inset-top, 0px)); width: auto; max-width: calc(100vw - 32px); padding: 10px 13px; border-radius: 14px; }
      #status .kicker { display: none; }
      #doing { margin-top: 0; font-size: 17px; }
      .stats { gap: 14px; margin-top: 8px; padding-top: 8px; }
      .stats b { font-size: 15px; }
      .stats span { font-size: 10.5px; margin-top: 3px; }
      #dock { bottom: calc(14px + env(safe-area-inset-bottom, 0px)); padding: 5px; gap: 2px; border-radius: 16px; }
      #dock .glabel, #dock .sep { display: none; }
      .dbtn { height: 42px; padding: 0 11px; font-size: 14px; gap: 6px; border-radius: 11px; }
      .dbtn.icon { width: 42px; }
      .dbtn.play { padding: 0 13px; }
      .dbtn.play span { display: none; }
      #hint { bottom: calc(72px + env(safe-area-inset-bottom, 0px)); font-size: 12.5px; }
    }
  </style>
  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
  </script>
</head>
<body>
  <canvas id="world" aria-label="Pip, a small white box robot on two legs, walking across a terrain map"></canvas>

  <header id="top"><h1>Pip<em>.</em></h1><p>A small box on two legs, out for a walk.</p></header>

  <aside id="status" class="card" aria-live="polite">
    <div class="kicker">Now</div>
    <div id="doing">Out for a walk</div>
    <div class="stats">
      <div><b id="st-steps">0</b><span>steps</span></div>
      <div><b id="st-dist">0.0</b><span>meters</span></div>
      <div><b id="st-grid">0E 0N</b><span>map square</span></div>
    </div>
  </aside>

  <div id="hint"><b id="hint-verb">Click</b> the terrain to send Pip somewhere</div>

  <nav id="dock" aria-label="Controls">
    <button id="btn-play" class="dbtn play" type="button"></button>
    <span class="sep"></span>
    <div class="group" role="group" aria-label="View">
      <span class="glabel">View</span>
      <button id="rot-l" class="dbtn icon" type="button" aria-label="Rotate view left" title="Rotate left (Q)"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5.2 7.6A6 6 0 1 1 4.4 12" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="M4.2 3.6v4.3h4.3" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button id="rot-r" class="dbtn icon flip" type="button" aria-label="Rotate view right" title="Rotate right (E)"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5.2 7.6A6 6 0 1 1 4.4 12" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="M4.2 3.6v4.3h4.3" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button id="zoom-out" class="dbtn icon" type="button" aria-label="Zoom out" title="Zoom out (−)"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4.5 10h11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      <button id="zoom-in" class="dbtn icon" type="button" aria-label="Zoom in" title="Zoom in (+)"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4.5 10h11M10 4.5v11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    </div>
    <span class="sep"></span>
    <button id="btn-hi" class="dbtn" type="button">Say hi<kbd>W</kbd></button>
  </nav>

  <div id="loader"><h1>Pip<em>.</em></h1><div class="ld">surveying the terrain</div></div>

  <script type="module">
    import * as THREE from 'three';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
    import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

    const $ = (s) => document.querySelector(s);
    const TAU = Math.PI * 2;
    const UP = new THREE.Vector3(0, 1, 0);
    const XAX = new THREE.Vector3(1, 0, 0);

    // ---------------------------------------------------------------- map look
    const BG = new THREE.Color('#ece7dc');
    const INK = new THREE.Color('#2a2c29');
    const ACCENT = new THREE.Color('#E55B2B');
    const LAND = { deep: '#5d8886', sand: '#e6d5ae', low: '#bccb98', mid: '#9fb47b', high: '#869d67', stone: '#d2c9b2', water: '#86afad' };
    const WATER = -0.3;            // lake level
    const GRID = 2;                // one map square (world units); a cross marks every corner
    const CAM_DIST = 40, CAM_EL = 0.6, VIEW_H = 3.6;
    const FOG_NEAR = 9, FOG_FAR = 15;

    // ---------------------------------------------------------------- Pip's body plan (world units; Pip stands ~1.0 tall)
    const WALK_V = 0.5, HURRY_V = 0.7;
    const T_SWING = 0.34, LIFT = 0.075;
    const STANCE_W = 0.15, HIP_X = 0.15;
    const PELVIS = 0.44, ANKLE_H = 0.05, TOE = 0.125, HEEL = 0.075;
    const L1 = 0.25, L2 = 0.25;
    const BODY_R = 0.34;
    const M_PER_UNIT = 0.5;        // odometer: Pip is about 50 cm tall

    // Radial haze around the camera target (instead of depth fog) so the map fades out like a vignette.
    THREE.ShaderChunk.fog_vertex = `#ifdef USE_FOG
      vec4 fogW = vec4(transformed, 1.0);
      #ifdef USE_INSTANCING
        fogW = instanceMatrix * fogW;
      #endif
      fogW = modelMatrix * fogW;
      vec3 fogFwd = -vec3(viewMatrix[0][2], viewMatrix[1][2], viewMatrix[2][2]);
      vFogDepth = length(fogW.xz - (cameraPosition + fogFwd * ${CAM_DIST.toFixed(1)}).xz);
    #endif`;

    const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
    const damp = (k, dt) => 1 - Math.exp(-k * dt);
    const wrap = (a) => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
    const angTo = (from, to) => wrap(to - from);
    const hump = (t, a, b) => (t <= a || t >= b ? 0 : Math.sin((Math.PI * (t - a)) / (b - a)));
    function ihash(i, j, k) {
      let h = Math.imul(i | 0, 0x27d4eb2d) ^ Math.imul(j | 0, 0x165667b1) ^ Math.imul(k | 0, 0x9e3779b1);
      h = Math.imul(h ^ (h >>> 15), 0x85ebca6b); h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35);
      return (h ^ (h >>> 16)) >>> 0;
    }
    const hash = (i, j, k) => ihash(i, j, k) / 4294967296;
    const Spring = (x = 0) => ({ x, v: 0 });
    function spring(s, target, dt, k = 60, c = 11) { s.v += ((target - s.x) * k - s.v * c) * dt; s.x += s.v * dt; return s.x; }

    // ---------------------------------------------------------------- terrain height field (Perlin fbm, deterministic)
    const GX = new Float32Array(256), GZ = new Float32Array(256);
    for (let i = 0; i < 256; i++) { GX[i] = Math.cos((i / 256) * TAU); GZ[i] = Math.sin((i / 256) * TAU); }
    function perlin(x, z) {
      const x0 = Math.floor(x), z0 = Math.floor(z), fx = x - x0, fz = z - z0;
      const u = fx * fx * fx * (fx * (fx * 6 - 15) + 10), v = fz * fz * fz * (fz * (fz * 6 - 15) + 10);
      let k = ihash(x0, z0, 7) & 255; const a = GX[k] * fx + GZ[k] * fz;
      k = ihash(x0 + 1, z0, 7) & 255; const b = GX[k] * (fx - 1) + GZ[k] * fz;
      k = ihash(x0, z0 + 1, 7) & 255; const c = GX[k] * fx + GZ[k] * (fz - 1);
      k = ihash(x0 + 1, z0 + 1, 7) & 255; const d = GX[k] * (fx - 1) + GZ[k] * (fz - 1);
      return (a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v) * 1.41;
    }
    function height(x, z) {
      return 0.66 * perlin(x / 9.5 + 17.3, z / 9.5 - 4.1) + 0.26 * perlin(x / 4.1 - 9.2, z / 4.1 + 2.7) + 0.06 * perlin(x / 1.7 + 3.3, z / 1.7 + 8.8);
    }
    function normalAt(x, z, out) { const e = 0.06; return out.set(height(x - e, z) - height(x + e, z), 2 * e, height(x, z - e) - height(x, z + e)).normalize(); }
    const dry = (x, z, m = 0.05) => height(x, z) > WATER + m;
    const forestAt = (x, z) => perlin(x / 7 + 50.5, z / 7 - 30.5);

    // ---------------------------------------------------------------- materials
    const MAT = {
      white: new THREE.MeshPhysicalMaterial({ color: 0xf6f5f1, roughness: 0.26, clearcoat: 0.8, clearcoatRoughness: 0.12 }),
      white2: new THREE.MeshPhysicalMaterial({ color: 0xe4e3dd, roughness: 0.45, clearcoat: 0.3 }),
      graphite: new THREE.MeshStandardMaterial({ color: 0x222421, roughness: 0.4, metalness: 0.35 }),
      steel: new THREE.MeshStandardMaterial({ color: 0xc4c4be, roughness: 0.18, metalness: 1 }),
      rubber: new THREE.MeshStandardMaterial({ color: 0x2c2d2b, roughness: 0.9 }),
      glass: new THREE.MeshPhysicalMaterial({ color: 0x060606, roughness: 0.05, metalness: 0.1, clearcoat: 1, clearcoatRoughness: 0.02 }),
      accent: new THREE.MeshBasicMaterial({ color: ACCENT }),
      accentSolid: new THREE.MeshPhysicalMaterial({ color: ACCENT, roughness: 0.35, clearcoat: 0.6 }),
      off: new THREE.MeshStandardMaterial({ color: 0x4a4944, roughness: 0.5 }),
      prop: new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.85 }),
      propGhost: new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.85, transparent: true, opacity: 0.28, depthWrite: false }),
    };
    function mesh(geo, mat, parent) {
      const m = new THREE.Mesh(geo, mat);
      m.castShadow = true; m.receiveShadow = true;
      parent?.add(m);
      return m;
    }
    const rbox = (w, h, d, r, mat, parent, seg = 4) => mesh(new RoundedBoxGeometry(w, h, d, seg, r), mat, parent);
    const sphere = (r, mat, parent, seg = 32) => mesh(new THREE.SphereGeometry(r, seg, Math.round(seg * 0.66)), mat, parent);
    const axle = (r, h, mat, parent, seg = 24) => mesh(new THREE.CylinderGeometry(r, r, h, seg), mat, parent);
    // Tapered limb with rounded ends, from the origin up +Y for `len`.
    function limbGeo(r0, r1, len) {
      const pts = [];
      for (let i = 0; i <= 8; i++) { const a = -Math.PI / 2 + (i / 8) * (Math.PI / 2); pts.push(new THREE.Vector2(Math.cos(a) * r0, Math.sin(a) * r0)); }
      for (let i = 0; i <= 8; i++) { const a = (i / 8) * (Math.PI / 2); pts.push(new THREE.Vector2(Math.cos(a) * r1, len + Math.sin(a) * r1)); }
      return new THREE.LatheGeometry(pts, 28);
    }
    function roundedRect(w, h, r) {
      const s = new THREE.Shape(), x = -w / 2, y = -h / 2;
      s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
      s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
      s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
      return s;
    }
    const _d = new THREE.Vector3();
    function aim(m, a, b) { m.position.copy(a); _d.subVectors(b, a).normalize(); m.quaternion.setFromUnitVectors(UP, _d); }
    function orient(m, axis) { m.quaternion.setFromUnitVectors(UP, _d.copy(axis).normalize()); }
    // Orientation of something standing on the ground: yaw about the terrain normal n.
    const _bx = new THREE.Vector3(), _bz = new THREE.Vector3(), _bm = new THREE.Matrix4();
    function groundQuat(q, n, yaw) {
      _bz.set(Math.sin(yaw), 0, Math.cos(yaw)); _bz.addScaledVector(n, -_bz.dot(n)).normalize();
      _bx.crossVectors(n, _bz);
      return q.setFromRotationMatrix(_bm.makeBasis(_bx, n, _bz));
    }

    // ================================================================ PIP
    // One rounded white box with a glossy face screen, on two bird-style legs (knees bend back).
    // Feet are stepped in world space onto the terrain; legs are two-bone IK.
    class Pip {
      constructor(scene, x, z) {
        this.scene = scene;
        this.root = new THREE.Group();
        this.body = new THREE.Group();
        this.shell = new THREE.Group();
        this.body.add(this.shell);
        this.root.add(this.body);
        scene.add(this.root);
        this.buildBody(); this.buildFace(); this.buildLegs();

        this.x = x; this.z = z; this.h = 0; this.v = 0; this.w = 0; this.accel = 0; this.slope = 0;
        this.gy = height(x, z); this.crouch = 0; this.crouchV = 0;
        this.t = 0; this.dist = 0; this.steps = 0; this.lean = 0; this.thump = 0; this.flash = 0; this.dip = 0;
        this.feet = [1, -1].map((side) => {
          const px = x + side * STANCE_W, pz = z;
          return {
            side, pos: new THREE.Vector3(px, height(px, pz), pz), n: normalAt(px, pz, new THREE.Vector3()), yaw: 0,
            swing: false, u: 0, T: T_SWING, from: new THREE.Vector3(), fromN: new THREE.Vector3(), fromYaw: 0, travel: 0, lift: 0, pitch: 0,
          };
        });
        this.next = 0; this.sinceLand = 1;
        this.eye = { x: Spring(), y: Spring() };
        this.blink = { next: 1.2, t: -1, dur: 0.17 };
        this.happy = Spring(0); this.open = Spring(1); this.wide = Spring(0);
        this.saccade = { t: 0, x: 0, y: 0 }; this.lastLook = 0;
        this.ant = { x: Spring(), z: Spring() };
        this.onStep = () => {};
        this.collide = () => {};
        const V = () => new THREE.Vector3();
        Object.assign(this, { _t: V(), _a: V(), _h: V(), _k: V(), _e: V(), _p: V(), _n: V(), _f: V(), _l: V(), _nt: V(), _qp: new THREE.Quaternion() });
      }

      buildBody() {
        const S = this.shell;
        rbox(0.58, 0.5, 0.5, 0.09, MAT.white, S, 6).position.y = 0.3;                          // the box: y 0.05 .. 0.55
        const lid = rbox(0.4, 0.012, 0.3, 0.005, MAT.white2, S); lid.position.set(0, 0.552, -0.02);
        const hips = rbox(0.42, 0.09, 0.28, 0.035, MAT.graphite, S); hips.position.y = 0.05;
        for (const s of [1, -1]) {
          const hj = axle(0.052, 0.07, MAT.graphite, S); hj.rotation.z = Math.PI / 2; hj.position.set(s * HIP_X, 0, 0);
          const cap = axle(0.028, 0.074, MAT.steel, S, 16); cap.rotation.z = Math.PI / 2; cap.position.set(s * HIP_X, 0, 0);
        }
        // status lights on both flanks, vent on the back
        this.leds = [1, -1].map((s) => { const l = rbox(0.008, 0.022, 0.12, 0.004, MAT.off, S, 2); l.position.set(s * 0.291, 0.43, 0.07); return l; });
        for (let i = 0; i < 3; i++) { const v = rbox(0.26, 0.012, 0.008, 0.004, MAT.graphite, S, 2); v.position.set(0, 0.2 + i * 0.04, -0.251); }
        // antenna with a springy tip
        this.antenna = new THREE.Group(); this.antenna.position.set(-0.17, 0.55, -0.13); S.add(this.antenna);
        axle(0.024, 0.02, MAT.graphite, this.antenna).position.y = 0.006;
        axle(0.006, 0.17, MAT.steel, this.antenna, 8).position.y = 0.09;
        sphere(0.023, MAT.accentSolid, this.antenna, 16).position.y = 0.185;
      }

      buildFace() {
        const S = this.shell;
        const visor = mesh(new THREE.ExtrudeGeometry(roundedRect(0.39, 0.24, 0.075), { depth: 0.008, bevelEnabled: true, bevelThickness: 0.006, bevelSize: 0.006, bevelSegments: 3, curveSegments: 10 }), MAT.glass, S);
        visor.position.set(0, 0.315, 0.244);
        const c = document.createElement('canvas'); c.width = 256; c.height = 128;
        this.fg = c.getContext('2d');
        this.faceTex = new THREE.CanvasTexture(c);
        this.faceTex.colorSpace = THREE.SRGBColorSpace;
        const face = new THREE.Mesh(new THREE.PlaneGeometry(0.37, 0.185), new THREE.MeshBasicMaterial({ map: this.faceTex, transparent: true, toneMapped: false, depthWrite: false }));
        face.position.set(0, 0.315, 0.2595);
        S.add(face);
      }

      buildLegs() {
        const S = this.scene;
        const thighGeo = limbGeo(0.05, 0.039, L1), shinGeo = limbGeo(0.039, 0.028, L2);
        this.legs = [1, -1].map((side) => {
          const thigh = mesh(thighGeo, MAT.white, S);
          const shin = mesh(shinGeo, MAT.white, S);
          const knee = new THREE.Group(); S.add(knee);
          axle(0.042, 0.086, MAT.graphite, knee); axle(0.022, 0.092, MAT.steel, knee, 12);
          const foot = new THREE.Group(); S.add(foot);
          sphere(0.03, MAT.graphite, foot, 16);
          rbox(0.12, 0.045, 0.2, 0.02, MAT.white, foot).position.set(0, -0.027, 0.028);
          rbox(0.124, 0.014, 0.204, 0.006, MAT.rubber, foot).position.set(0, -0.043, 0.028);
          rbox(0.05, 0.01, 0.028, 0.004, MAT.accentSolid, foot, 2).position.set(0, -0.012, -0.058);
          return { side, thigh, shin, knee, foot };
        });
      }

      // Where a foot should land if it lifts now: ahead of where the body will be, on the ground there.
      target(f, lead, out) {
        const hm = this.h + this.w * lead * 0.5, hp = this.h + this.w * lead;
        const px = this.x + Math.sin(hm) * this.v * lead, pz = this.z + Math.cos(hm) * this.v * lead;
        out.set(px + Math.cos(hp) * f.side * STANCE_W, 0, pz - Math.sin(hp) * f.side * STANCE_W);
        out.y = height(out.x, out.z);
        return hp;
      }

      stepFeet(dt) {
        const moving = Math.abs(this.v) > 0.03 || Math.abs(this.w) > 0.1;
        const T = T_SWING - 0.07 * clamp((Math.abs(this.v) - WALK_V) / (HURRY_V - WALK_V), 0, 1);
        const t = this._t;
        this.sinceLand += dt;
        if (!this.feet.some((f) => f.swing) && this.sinceLand > (moving ? 0.01 : 0.12)) {
          const a = this.feet[this.next], b = this.feet[1 - this.next];
          for (const f of [a, b]) {
            const yawT = this.target(f, 1.5 * T + 0.01, t);
            const err = Math.hypot(t.x - f.pos.x, t.z - f.pos.z), yerr = Math.abs(angTo(f.yaw, yawT));
            if ((moving && f === a) || err > 0.03 || yerr > 0.18) {
              Object.assign(f, { swing: true, u: 0, T, fromYaw: f.yaw, travel: err });
              f.from.copy(f.pos); f.fromN.copy(f.n);
              this.next = this.feet.indexOf(f) ^ 1;
              break;
            }
          }
        }
        for (const f of this.feet) {
          if (!f.swing) continue;
          f.u = Math.min(1, f.u + dt / f.T);
          const yawT = this.target(f, (1 - f.u) * f.T + 0.5 * f.T + 0.01, t);
          const e = f.u * f.u * (3 - 2 * f.u);
          f.pos.lerpVectors(f.from, t, e);
          f.n.lerpVectors(f.fromN, normalAt(t.x, t.z, this._nt), e).normalize();
          f.yaw = f.fromYaw + angTo(f.fromYaw, yawT) * e;
          const arc = Math.sin(Math.PI * Math.pow(f.u, 0.8));
          f.lift = (LIFT * clamp(f.travel / 0.1, 0.3, 1) + Math.max(0, t.y - f.from.y) * 0.6) * arc;
          f.pitch = 0.3 * Math.sin(TAU * f.u) * clamp(f.travel / 0.14, 0, 1);
          if (f.u >= 1) {
            Object.assign(f, { swing: false, lift: 0, pitch: 0 });
            this.sinceLand = 0; this.thump = 1; this.flash = 1; this.steps++;
            this.ant.x.v += 1.1;
            this.onStep(f);
          }
        }
      }

      // Ankle in world space, raised along the ground normal so a pitched toe or heel never sinks in.
      ankle(f, out) {
        const c = Math.cos(f.pitch), s = Math.sin(f.pitch);
        const low = Math.min(-ANKLE_H * c - TOE * s, -ANKLE_H * c + HEEL * s);
        return out.copy(f.pos).addScaledVector(f.n, Math.max(f.lift + ANKLE_H, -low));
      }

      // c: { vt, wt, look, happy, wide, sleepy, crouch, blink }
      update(dt, c) {
        this.t += dt;
        const px = this.x, pz = this.z, vPrev = this.v;
        const fx = Math.sin(this.h), fz = Math.cos(this.h);
        const slope = (height(this.x + fx * 0.3, this.z + fz * 0.3) - height(this.x - fx * 0.3, this.z - fz * 0.3)) / 0.6;
        this.slope += (slope - this.slope) * damp(4, dt);
        const vt = c.vt * (1 - clamp(this.slope * 0.9, -0.15, 0.4));      // slower uphill
        this.v += (vt - this.v) * damp(vt > this.v ? 2.6 : 4, dt);
        this.w += (c.wt - this.w) * damp(5, dt);
        this.h = wrap(this.h + this.w * dt);
        this.x += Math.sin(this.h) * this.v * dt;
        this.z += Math.cos(this.h) * this.v * dt;
        if (!dry(this.x, this.z, 0.02)) { this.x = px; this.z = pz; }       // Pip does not swim
        this.collide(this);
        this.accel += ((this.v - vPrev) / Math.max(dt, 1e-3) - this.accel) * damp(8, dt);
        this.dist += Math.hypot(this.x - px, this.z - pz);
        const cr = this.crouch;
        this.crouch += ((c.crouch || 0) - this.crouch) * damp(9, dt);
        this.crouchV = (this.crouch - cr) / Math.max(dt, 1e-3);
        this.stepFeet(dt);
        this.poseBody(dt);
        this.poseLegs();
        this.poseFace(dt, c);
      }

      poseBody(dt) {
        let sway = 0, bob = 0, twist = 0;
        for (const f of this.feet) {
          if (!f.swing) continue;
          const s = Math.sin(Math.PI * f.u) * clamp(f.travel / 0.08, 0.3, 1);
          sway -= f.side * s; bob += s; twist -= f.side * s;
        }
        this.thump = Math.max(0, this.thump - dt * 7);
        this.dip = hump(1 - this.thump, 0, 1);
        const ground = 0.5 * height(this.x, this.z) + 0.25 * (this.feet[0].pos.y + this.feet[1].pos.y);
        this.gy += (ground - this.gy) * damp(10, dt);
        this.lean += (clamp(0.05 * this.v / WALK_V + this.accel * 0.04, -0.08, 0.1) - this.lean) * damp(4, dt);
        this.root.position.set(this.x, 0, this.z);
        this.root.rotation.y = this.h;
        const B = this.body;
        B.position.set(sway * 0.018, this.gy + PELVIS + bob * 0.018 - this.dip * 0.016 - this.crouch * 0.14 + Math.sin(this.t * 2.1) * 0.003, 0);
        B.rotation.set(this.lean, twist * 0.04 + this.eye.x.x * 0.06, -sway * 0.05);
        this.shell.scale.set(1 + this.dip * 0.018, 1 - this.dip * 0.035, 1 + this.dip * 0.018);
        // antenna lags behind the body, wobbles on every footfall and bounce
        spring(this.ant.x, clamp(-this.accel * 0.15 - this.crouchV * 0.12, -0.5, 0.5), dt, 90, 4.5);
        spring(this.ant.z, clamp(this.w * 0.18 + sway * 0.08, -0.5, 0.5), dt, 90, 4.5);
        this.antenna.rotation.set(this.ant.x.x, 0, this.ant.z.x);
        this.flash = Math.max(0, this.flash - dt * 5);
        for (const l of this.leds) l.material = this.flash > 0.25 ? MAT.accent : MAT.off;
      }

      poseLegs() {
        const B = this.body, h = this.h;
        const fwd = this._f.set(Math.sin(h), 0, Math.cos(h)), left = this._l.set(Math.cos(h), 0, -Math.sin(h));
        this.root.updateMatrixWorld(true);
        let excess = 0;
        this.legs.forEach((L, i) => {
          const hip = B.localToWorld(this._h.set(L.side * HIP_X, 0, 0));
          excess = Math.max(excess, hip.distanceTo(this.ankle(this.feet[i], this._a)) - (L1 + L2 - 0.004));
        });
        if (excess > 0) { B.position.y -= excess; this.root.updateMatrixWorld(true); }
        this.legs.forEach((L, i) => {
          const f = this.feet[i];
          const H = B.localToWorld(this._h.set(L.side * HIP_X, 0, 0));
          const A = this.ankle(f, this._a);
          const e1 = this._e.subVectors(A, H); const d0 = e1.length(); e1.divideScalar(d0 || 1);
          const dc = clamp(d0, Math.abs(L1 - L2) + 1e-3, L1 + L2 - 1e-3);
          const e2 = this._p.copy(fwd).multiplyScalar(-1).addScaledVector(left, L.side * 0.1);   // knees point back
          e2.addScaledVector(e1, -e2.dot(e1)).normalize();
          const a = Math.acos(clamp((L1 * L1 + dc * dc - L2 * L2) / (2 * L1 * dc), -1, 1));
          const K = this._k.copy(H).addScaledVector(e1, Math.cos(a) * L1).addScaledVector(e2, Math.sin(a) * L1);
          const end = this._t.copy(H).addScaledVector(e1, dc);
          aim(L.thigh, H, K);
          aim(L.shin, K, end);
          L.knee.position.copy(K);
          orient(L.knee, this._n.crossVectors(e1, e2));
          L.foot.position.copy(A);
          groundQuat(L.foot.quaternion, f.n, f.yaw).multiply(this._qp.setFromAxisAngle(XAX, f.pitch));
        });
      }

      poseFace(dt, c) {
        let lx = 0, ly = 0;
        if (c.look) {
          const dx = c.look.x - this.x, dz = c.look.z - this.z;
          lx = clamp(angTo(this.h, Math.atan2(dx, dz)) / 1.1, -1, 1);
          ly = clamp(Math.atan2(c.look.y - (this.gy + 0.75), Math.hypot(dx, dz)) / 0.6, -1, 1);
        }
        const bl = this.blink;
        if ((c.blink || Math.abs(lx - this.lastLook) > 0.6) && bl.t < 0) bl.next = 0;     // big glances come with a blink
        this.lastLook = lx;
        bl.next -= dt;
        if (bl.next <= 0 && bl.t < 0) { bl.t = 0; bl.dur = Math.random() < 0.22 ? 0.44 : 0.17; bl.next = 2 + Math.random() * 3.5; }
        let close = 0;
        if (bl.t >= 0) {
          bl.t += dt;
          close = bl.dur > 0.3 ? Math.max(hump(bl.t, 0, 0.17), hump(bl.t, 0.25, 0.42)) : hump(bl.t, 0, 0.17);
          if (bl.t >= bl.dur) bl.t = -1;
        }
        const S = this.saccade;
        S.t -= dt;
        if (S.t <= 0) { S.t = 0.5 + Math.random() * 1.5; S.x = (Math.random() - 0.5) * 0.25; S.y = (Math.random() - 0.5) * 0.2; }
        spring(this.eye.x, lx + S.x, dt, 110, 14);
        spring(this.eye.y, ly + S.y, dt, 110, 14);
        const hap = spring(this.happy, c.happy ? 1 : 0, dt, 60, 12);
        const wide = spring(this.wide, c.wide ? 1 : 0, dt, 60, 10);
        const open = spring(this.open, c.sleepy ? 0.1 : this.slope > 0.16 && this.v > 0.1 ? 0.72 : 1, dt, 40, 10);
        this.drawFace(this.eye.x.x, this.eye.y.x, Math.max(0.06, open * (1 - close * 0.95)), hap, wide);
      }

      drawFace(lx, ly, open, happy, wide) {
        const g = this.fg, W = 256, H = 128;
        g.clearRect(0, 0, W, H);
        g.fillStyle = g.strokeStyle = '#fff4e4';
        g.shadowColor = 'rgba(255, 150, 90, 0.9)'; g.shadowBlur = 16;
        for (const s of [-1, 1]) {
          const cx = W / 2 + s * 56 + clamp(lx, -1.2, 1.2) * 20, cy = H / 2 - clamp(ly, -1.2, 1.2) * 12;
          if (happy > 0.5) {
            g.lineWidth = 15; g.lineCap = 'round';
            g.beginPath(); g.arc(cx, cy + 20, 28, Math.PI * 1.15, Math.PI * 1.85); g.stroke();
          } else {
            const w = 50 * (1 + wide * 0.12), h = Math.max(7, 74 * open * (1 + wide * 0.1));
            g.beginPath(); g.roundRect(cx - w / 2, cy - h / 2, w, h, Math.min(w, h) / 2); g.fill();
          }
        }
        this.faceTex.needsUpdate = true;
      }
    }

    // ================================================================ scene
    const canvas = $('#world');
    const coarse = matchMedia('(pointer: coarse)').matches;
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.toneMapping = THREE.NeutralToneMapping;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    scene.background = BG.clone();
    scene.fog = new THREE.Fog(BG.clone(), FOG_NEAR, FOG_FAR);
    scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
    scene.environmentIntensity = 0.32;
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 120);

    scene.add(new THREE.HemisphereLight(0xf4f1ea, 0xa9ab98, 0.85));
    const key = new THREE.DirectionalLight(0xfff1de, 1.9);
    key.castShadow = true;
    key.shadow.mapSize.setScalar(coarse ? 2048 : 4096);
    Object.assign(key.shadow.camera, { left: -15, right: 15, top: 15, bottom: -15, near: 0.5, far: 50 });
    key.shadow.camera.updateProjectionMatrix();
    key.shadow.bias = -0.0006; key.shadow.normalBias = 0.03;
    scene.add(key, key.target);
    const KEY_OFF = new THREE.Vector3(-7, 14, 9);

    // shared map marks: dashed square boundaries, a bold cross at every corner
    const U = {
      uInk: { value: INK.clone() }, uTime: { value: 0 },
      uDeep: { value: new THREE.Color(LAND.deep) }, uSand: { value: new THREE.Color(LAND.sand) }, uLow: { value: new THREE.Color(LAND.low) },
      uMid: { value: new THREE.Color(LAND.mid) }, uHigh: { value: new THREE.Color(LAND.high) }, uStone: { value: new THREE.Color(LAND.stone) },
    };
    const MARKS = /* glsl */`
      uniform vec3 uInk; uniform float uTime;
      varying vec3 vW;
      float mapMarks(vec2 p, out float cross) {
        vec2 fw = max(fwidth(p), vec2(1e-4));
        vec2 g = abs(fract(p / ${GRID.toFixed(1)} + 0.5) - 0.5) * ${GRID.toFixed(1)};
        float lx = 1.0 - smoothstep(0.005, 0.005 + fw.x, g.x);
        float lz = 1.0 - smoothstep(0.005, 0.005 + fw.y, g.y);
        float arm = 0.2, t = 0.016;
        cross = max((1.0 - smoothstep(t, t + fw.x, g.x)) * (1.0 - smoothstep(arm, arm + fw.y, g.y)),
                    (1.0 - smoothstep(t, t + fw.y, g.y)) * (1.0 - smoothstep(arm, arm + fw.x, g.x)));
        return max(lx, lz);
      }`;
    function worldVarying(sh) {
      Object.assign(sh.uniforms, U);
      sh.vertexShader = sh.vertexShader
        .replace('#include <common>', '#include <common>\nvarying vec3 vW;\nvarying vec3 vWN;')
        .replace('#include <begin_vertex>', '#include <begin_vertex>\nvW = (modelMatrix * vec4(transformed, 1.0)).xyz;\nvWN = normalize(mat3(modelMatrix) * objectNormal);');
    }

    // terrain: hypsometric tint, contour lines every 0.1 (index every 0.5), map marks on land
    const terrainMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.94 });
    terrainMat.onBeforeCompile = (sh) => {
      worldVarying(sh);
      sh.fragmentShader = sh.fragmentShader
        .replace('#include <common>', `#include <common>
          uniform vec3 uDeep, uSand, uLow, uMid, uHigh, uStone;
          varying vec3 vWN;
          ${MARKS}
          vec3 terrainColor() {
            float h = vW.y, slope = 1.0 - vWN.y, W = ${WATER.toFixed(3)};
            vec3 col = mix(uLow, uMid, smoothstep(-0.15, 0.2, h));
            col = mix(col, uHigh, smoothstep(0.2, 0.55, h));
            col = mix(col, uStone, clamp(smoothstep(0.08, 0.22, slope) * 0.45 + smoothstep(0.62, 0.85, h), 0.0, 1.0));
            col = mix(col, uSand, 1.0 - smoothstep(W + 0.03, W + 0.1, h));
            col = mix(col, uDeep, smoothstep(W, W - 0.35, h));
            float c = h / 0.1, fc = max(fwidth(c), 1e-4);
            float dc = abs(fract(c + 0.5) - 0.5);
            float line = 1.0 - smoothstep(0.3 * fc, 1.2 * fc, dc);
            float idx = 1.0 - step(0.5, mod(floor(c + 0.5), 5.0));
            float land = step(W, h);
            col = mix(col, uInk, line * mix(0.04, mix(0.1, 0.24, idx), land));
            float cross; float lines = mapMarks(vW.xz, cross);
            col = mix(col, uInk, lines * 0.2 * land);
            col = mix(col, uInk, cross * 0.62 * land);
            return col;
          }`)
        .replace('#include <color_fragment>', '#include <color_fragment>\ndiffuseColor.rgb = terrainColor();');
    };
    const T_SIZE = 48, T_SEG = 160;
    const tgeo = new THREE.PlaneGeometry(T_SIZE, T_SIZE, T_SEG, T_SEG);
    tgeo.rotateX(-Math.PI / 2);
    const tbase = Float32Array.from(tgeo.attributes.position.array);
    const terrain = new THREE.Mesh(tgeo, terrainMat);
    terrain.receiveShadow = true; terrain.castShadow = true;
    scene.add(terrain);

    // lakes: a translucent sheet at water level, with the same grid and slow ripples
    const waterMat = new THREE.MeshStandardMaterial({ color: LAND.water, roughness: 0.14, metalness: 0, transparent: true, opacity: 0.8 });
    waterMat.onBeforeCompile = (sh) => {
      worldVarying(sh);
      sh.fragmentShader = sh.fragmentShader
        .replace('#include <common>', `#include <common>\nvarying vec3 vWN;\n${MARKS}`)
        .replace('#include <color_fragment>', `#include <color_fragment>
          float r = sin(vW.x * 3.1 + uTime * 0.8 + sin(vW.z * 1.3)) * sin(vW.z * 2.6 - uTime * 0.6);
          diffuseColor.rgb = mix(diffuseColor.rgb, vec3(1.0), smoothstep(0.9, 0.99, r) * 0.22);
          float cross; float lines = mapMarks(vW.xz, cross);
          diffuseColor.rgb = mix(diffuseColor.rgb, uInk, lines * 0.16 + cross * 0.5);`);
    };
    const water = new THREE.Mesh(new THREE.PlaneGeometry(T_SIZE, T_SIZE, 96, 96).rotateX(-Math.PI / 2), waterMat);
    water.receiveShadow = true;
    scene.add(water);

    let tcx = NaN, tcz = NaN;
    function recenterTerrain(x, z) {
      const cx = Math.round(x / 4) * 4, cz = Math.round(z / 4) * 4;
      if (cx === tcx && cz === tcz) return;
      tcx = cx; tcz = cz;
      const p = tgeo.attributes.position.array;
      for (let i = 0; i < p.length; i += 3) p[i + 1] = height(tbase[i] + cx, tbase[i + 2] + cz);
      tgeo.attributes.position.needsUpdate = true;
      tgeo.computeVertexNormals();
      tgeo.computeBoundingSphere();
      terrain.position.set(cx, 0, cz);
      water.position.set(cx, WATER, cz);
    }

    // ================================================================ props: low-poly trees in forest patches, boulders, survey stakes on corners
    function tint(g, hex) {
      g = g.index ? g.toNonIndexed() : g;
      const c = new THREE.Color(hex), n = g.attributes.position.count, a = new Float32Array(n * 3);
      for (let i = 0; i < n; i++) { a[i * 3] = c.r; a[i * 3 + 1] = c.g; a[i * 3 + 2] = c.b; }
      g.setAttribute('color', new THREE.BufferAttribute(a, 3));
      return g;
    }
    const trunk = () => tint(new THREE.CylinderGeometry(0.035, 0.048, 0.26, 6).translate(0, 0.13, 0), '#7c6c5a');
    const PGEO = {
      pine: [0, 1].map((k) => mergeGeometries([trunk(), ...[[0.28, 0.36, 0.32], [0.22, 0.31, 0.5], [0.145, 0.25, 0.66]].map(([r, h, y], i) =>
        tint(new THREE.ConeGeometry(r, h, 7).translate(0, y, 0), (k ? ['#5d7d53', '#66875b', '#709163'] : ['#6d8e5e', '#779866', '#81a26f'])[i]))])),
      round: [0, 1].map((k) => mergeGeometries([trunk(), tint(new THREE.IcosahedronGeometry(0.27, 1).scale(1, 0.92, 1).translate(0, 0.45, 0), k ? '#8aa66f' : '#9bb07a')])),
      rock: [0, 1, 2].map((k) => {
        const g = new THREE.IcosahedronGeometry(0.2, 0), p = g.attributes.position;
        for (let i = 0; i < p.count; i++) {
          const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
          const s = 1 + 0.28 * (hash(Math.round(x * 97), Math.round(y * 97) + k * 13, Math.round(z * 97)) - 0.5);
          p.setXYZ(i, x * s * 1.15, (y < 0 ? y * 0.3 : y * 0.8) * s, z * s);
        }
        g.computeVertexNormals();
        return tint(g, ['#bcb5a5', '#b1ab9c', '#c6c0b1'][k]);
      }),
      stake: [mergeGeometries([
        tint(new THREE.CylinderGeometry(0.011, 0.011, 0.34, 6).translate(0, 0.17, 0), '#f3f1ea'),
        tint(new THREE.ConeGeometry(0.03, 0.07, 8).rotateX(Math.PI).translate(0, 0.36, 0), '#E55B2B'),
        tint(new THREE.BoxGeometry(0.1, 0.055, 0.004).translate(0.05, 0.3, 0), '#E55B2B'),
      ])],
    };
    const PCELL = 1.4, PRANGE = 12, SRANGE = 9;
    const props = new Map();
    function placeProp(type, variant, x, z, s, yaw, key) {
      const m = mesh(PGEO[type][variant], MAT.prop, scene);
      m.position.set(x, height(x, z) - 0.02, z); m.rotation.y = yaw; m.scale.setScalar(s);
      const R = { pine: 0.22, round: 0.25, rock: 0.2, stake: 0.07 }[type], top = { pine: 0.8, round: 0.72, rock: 0.2, stake: 0.36 }[type];
      return { key, type, x, z, r: R * s, top: top * s + m.position.y, m };
    }
    function spawnCell(i, j) {
      const x = (i + 0.2 + hash(i, j, 2) * 0.6) * PCELL, z = (j + 0.2 + hash(i, j, 3) * 0.6) * PCELL;
      if (!dry(x, z, 0.12) || Math.hypot(x - START.x, z - START.z) < 2.2) return null;
      const r = hash(i, j, 1), s = 0.8 + 0.45 * hash(i, j, 6), yaw = hash(i, j, 5) * TAU;
      if (r < clamp((forestAt(x, z) - 0.08) * 1.7, 0, 0.72)) {
        const pine = hash(i, j, 4) < 0.62;
        return placeProp(pine ? 'pine' : 'round', hash(i, j, 8) < 0.5 ? 0 : 1, x, z, s, yaw, `${i},${j}`);
      }
      if (r > 0.962) return placeProp('rock', ihash(i, j, 9) % 3, x, z, s, yaw, `${i},${j}`);
      return null;
    }
    function spawnStake(i, j) {
      const x = i * GRID, z = j * GRID;
      if (hash(i, j, 21) > 0.07 || !dry(x, z, 0.08) || forestAt(x, z) > 0.2) return null;
      return placeProp('stake', 0, x + 0.12, z + 0.12, 1, hash(i, j, 22) * TAU, `s${i},${j}`);
    }
    let propClock = 0;
    function updateProps(dt, force) {
      propClock -= dt;
      if (propClock > 0 && !force) return;
      propClock = 0.3;
      const fill = (prefix, cell, range, spawn) => {
        const ci = Math.round(cam.x / cell), cj = Math.round(cam.z / cell);
        for (let i = ci - range; i <= ci + range; i++) for (let j = cj - range; j <= cj + range; j++) {
          const key = prefix + i + ',' + j;
          if (!props.has(key)) props.set(key, { i, j, prefix, P: spawn(i, j) });
        }
        for (const [key, E] of props) {
          if (E.prefix !== prefix || (Math.abs(E.i - ci) <= range && Math.abs(E.j - cj) <= range)) continue;
          if (E.P) scene.remove(E.P.m);
          props.delete(key);
        }
      };
      fill('c', PCELL, PRANGE, spawnCell);
      fill('s', GRID, SRANGE, spawnStake);
    }
    let near = [];
    function nearProps(r) { near = []; for (const E of props.values()) if (E.P && Math.abs(E.P.x - pip.x) < r && Math.abs(E.P.z - pip.z) < r) near.push(E.P); return near; }

    // ================================================================ footprints, rings, goal flag
    function printTexture() {
      const c = document.createElement('canvas'); c.width = 64; c.height = 128;
      const g = c.getContext('2d');
      const rr = (x, y, w, h, r) => { g.beginPath(); g.roundRect(x, y, w, h, r); g.fill(); };
      g.fillStyle = '#fff';
      g.globalAlpha = 0.3; rr(5, 5, 54, 118, 24);
      g.globalAlpha = 1;
      for (let i = 0; i < 6; i++) rr(15, 16 + i * 17, 34, 7, 3.5);   // tread bars
      return new THREE.CanvasTexture(c);
    }
    const printTex = printTexture(), printGeo = new THREE.PlaneGeometry(0.12, 0.21).rotateX(-Math.PI / 2);
    const prints = Array.from({ length: 110 }, () => {
      const m = new THREE.Mesh(printGeo, new THREE.MeshBasicMaterial({ color: INK, map: printTex, transparent: true, opacity: 0, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -4, polygonOffsetUnits: -4 }));
      m.visible = false; m.renderOrder = 2;
      scene.add(m);
      return { m, age: 99 };
    });
    let printI = 0;
    const PRINT_LIFE = 26;

    const rings = [], ringGeo = new THREE.RingGeometry(0.93, 1, 72).rotateX(-Math.PI / 2);
    const _rn = new THREE.Vector3();
    function ring(x, z, { r0 = 0.05, r1 = 0.3, dur = 0.6, color = INK, opacity = 0.2, y } = {}) {
      const m = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color, transparent: true, depthWrite: false, opacity, polygonOffset: true, polygonOffsetFactor: -4, polygonOffsetUnits: -4 }));
      m.position.set(x, (y ?? Math.max(height(x, z), WATER)) + 0.006, z);
      if (y === undefined && dry(x, z, 0)) groundQuat(m.quaternion, normalAt(x, z, _rn), 0);
      scene.add(m);
      rings.push({ m, t: 0, r0, r1, dur, opacity });
    }

    const flag = new THREE.Group();
    {
      const pole = axle(0.008, 0.46, MAT.graphite, flag, 8); pole.position.y = 0.23;
      const shape = new THREE.Shape(); shape.moveTo(0, 0); shape.lineTo(0.17, -0.045); shape.lineTo(0, -0.09); shape.closePath();
      const cloth = new THREE.Mesh(new THREE.ShapeGeometry(shape), new THREE.MeshStandardMaterial({ color: ACCENT, roughness: 0.6, side: THREE.DoubleSide }));
      cloth.castShadow = true;
      const hinge = new THREE.Group(); hinge.position.y = 0.46; hinge.add(cloth); flag.add(hinge);
      flag.userData = { hinge, t: 0 };
      flag.visible = false;
      scene.add(flag);
    }

    // ================================================================ Pip
    const START = (() => {
      for (let r = 0; r < 60; r += 0.5) for (let a = 0; a < TAU; a += 0.4) {
        const x = Math.cos(a) * r, z = Math.sin(a) * r;
        if (dry(x, z, 0.25) && forestAt(x, z) < 0.05) return { x, z };
      }
      return { x: 0, z: 0 };
    })();
    const cam = { az: Math.PI / 4, azT: Math.PI / 4, zoom: 1.3, zoomT: 1.3, x: START.x, y: height(START.x, START.z) + 0.45, z: START.z };
    const pip = new Pip(scene, START.x, START.z);
    pip.onStep = (f) => {
      const P = prints[printI++ % prints.length];
      P.age = 0;
      P.m.position.copy(f.pos).addScaledVector(f.n, 0.004);
      P.m.position.x += Math.sin(f.yaw) * 0.028; P.m.position.z += Math.cos(f.yaw) * 0.028;
      groundQuat(P.m.quaternion, f.n, f.yaw);
      P.m.visible = true;
      if (f.travel > 0.05) ring(f.pos.x, f.pos.z + Math.cos(f.yaw) * 0.02, { r0: 0.05, r1: 0.17, dur: 0.45, opacity: 0.1 });
    };
    pip.collide = (b) => {
      for (const P of near) {
        const dx = b.x - P.x, dz = b.z - P.z, d = Math.hypot(dx, dz) || 1e-3, min = P.r + BODY_R;
        if (d < min) { b.x = P.x + (dx / d) * min; b.z = P.z + (dz / d) * min; }
      }
    };

    // ================================================================ what Pip does next (a small state machine, nothing learned)
    const LABEL = { walk: 'Out for a walk', look: 'Looking around', hi: 'Saying hi', doze: 'Taking a nap', goto: 'Heading to your spot' };
    const D = { state: 'walk', t: 0, dur: 9, phase: 0, pace: 1, h0: 0, goal: new THREE.Vector3(), best: 1e9, bestT: 0, t0: 0, clock: 0, escape: null, chk: { t: 0, x: START.x, z: START.z }, note: null };
    const wander = [Math.random() * TAU, Math.random() * TAU];
    const lookAt = new THREE.Vector3();
    function setState(state, extra = {}) {
      Object.assign(D, { state, t: 0, phase: 0, h0: pip.h }, extra);
      if (state === 'walk') D.pace = 0.88 + Math.random() * 0.24;
    }

    // Steer toward a direction, sliding around trees and rocks and turning away from water.
    function steer(dx, dz) {
      const fx = Math.sin(pip.h), fz = Math.cos(pip.h);
      const m = Math.hypot(dx, dz) || 1; dx /= m; dz /= m;
      for (const P of near) {
        const ox = pip.x - P.x, oz = pip.z - P.z, d = Math.hypot(ox, oz) || 1e-3;
        const gap = d - P.r - BODY_R;
        if (gap > 0.9) continue;
        const ahead = -(ox * fx + oz * fz) / d;
        if (ahead < -0.3) continue;
        const s = clamp(1 - gap / 0.9, 0, 1.4) * (0.5 + 0.5 * Math.max(0, ahead));
        const ux = ox / d, uz = oz / d;
        let tx = -uz, tz = ux;
        if (tx * dx + tz * dz < 0) { tx = -tx; tz = -tz; }
        dx += (ux * 0.8 + tx * 1.2) * s; dz += (uz * 0.8 + tz * 1.2) * s;
      }
      for (const [a, dist, w] of [[0, 1.1, 1.5], [0.55, 0.95, 1], [-0.55, 0.95, 1], [0, 0.55, 2.5]]) {
        const hx = Math.sin(pip.h + a), hz = Math.cos(pip.h + a);
        if (!dry(pip.x + hx * dist, pip.z + hz * dist, 0.06)) { dx -= hx * w; dz -= hz * w; }
      }
      return clamp(angTo(pip.h, Math.atan2(dx, dz)) * 1.8, -1.25, 1.25);
    }
    function ahead(dist, y, yaw = 0) { const hh = pip.h + yaw; return lookAt.set(pip.x + Math.sin(hh) * dist, pip.gy + y, pip.z + Math.cos(hh) * dist); }
    function interesting() {
      let best = null, bd = 2.4;
      for (const P of near) {
        const dx = P.x - pip.x, dz = P.z - pip.z, d = Math.hypot(dx, dz);
        if (d < bd && Math.abs(angTo(pip.h, Math.atan2(dx, dz))) < 1.1) { best = P; bd = d; }
      }
      return best;
    }

    function think(dt) {
      D.t += dt; D.clock += dt;
      const c = { vt: 0, wt: 0, look: null, happy: false, wide: false, sleepy: false, crouch: 0, blink: false };
      // unstick: if a walk has gone nowhere for a while, turn well away
      if (D.clock - D.chk.t > 2.5) {
        if (D.state === 'walk' && Math.hypot(pip.x - D.chk.x, pip.z - D.chk.z) < 0.35) D.escape = { h: pip.h + (Math.random() < 0.5 ? 1 : -1) * (2 + Math.random()), until: D.clock + 2.2 };
        D.chk = { t: D.clock, x: pip.x, z: pip.z };
      }
      if (D.escape && D.clock > D.escape.until) D.escape = null;

      if (D.state === 'walk') {
        const w = 0.5 * Math.sin(D.clock * 0.21 + wander[0]) + 0.32 * Math.sin(D.clock * 0.53 + wander[1]);
        const hd = D.escape ? D.escape.h : pip.h + w * 0.3;
        c.wt = steer(Math.sin(hd), Math.cos(hd));
        c.vt = WALK_V * D.pace * (1 - 0.35 * Math.min(1, Math.abs(c.wt) / 1.25));
        const P = interesting();
        c.look = P ? lookAt.set(P.x, P.top, P.z) : ahead(3, 0.5, 0.3 * Math.sin(D.clock * 0.7));
        if (D.t > D.dur) {
          const r = Math.random();
          if (r < 0.25) setState('look'); else if (r < 0.43) setState('hi'); else if (r < 0.5) setState('doze'); else setState('walk', { dur: 7 + Math.random() * 8 });
        }
      } else if (D.state === 'look') {
        const k = D.t;
        const tgt = k < 1.6 ? D.h0 + 0.75 : k < 3.3 ? D.h0 - 0.6 : D.h0;
        c.wt = clamp(angTo(pip.h, tgt) * 2.4, -1, 1);
        c.look = ahead(3, 0.8, k < 1.6 ? 0.7 : k < 3.3 ? -0.7 : 0);
        c.wide = true;
        if (k > 4.3) setState('walk', { dur: 6 + Math.random() * 6 });
      } else if (D.state === 'hi') {
        const err = angTo(pip.h, cam.az);
        c.look = lookAt.set(pip.x + Math.sin(cam.az) * 5, pip.gy + 3, pip.z + Math.cos(cam.az) * 5);
        if (D.phase === 0) {
          c.wt = clamp(err * 3, -1.4, 1.4);
          if (Math.abs(err) < 0.25 || D.t > 2) { D.phase = 1; D.t0 = D.t; c.blink = true; }
        } else {
          const k = D.t - D.t0;
          c.wt = clamp(err * 2, -0.8, 0.8);
          c.happy = true;
          c.crouch = 0.42 * (0.5 - 0.5 * Math.cos(TAU * clamp(k / 0.5, 0, 3)));   // three little bounces
          if (k > 2.4) setState('walk', { dur: 6 + Math.random() * 6 });
        }
      } else if (D.state === 'doze') {
        c.crouch = D.t > 0.3 && D.t < 5.6 ? 1 : 0;
        c.sleepy = D.t > 0.9 && D.t < 5.4;
        c.look = ahead(2, -0.4);
        if (D.t > 6.2) setState('walk', { dur: 6 + Math.random() * 6 });
      } else if (D.state === 'goto') {
        const gx = D.goal.x - pip.x, gz = D.goal.z - pip.z, gd = Math.hypot(gx, gz);
        c.wt = steer(gx, gz);
        c.vt = HURRY_V * clamp(gd / 0.5, 0.3, 1);
        c.look = lookAt.set(D.goal.x, height(D.goal.x, D.goal.z) + 0.2, D.goal.z);
        if (gd < D.best - 0.05) { D.best = gd; D.bestT = D.t; }
        if (gd < 0.16) { ring(D.goal.x, D.goal.z, { r0: 0.14, r1: 0.55, dur: 0.7, color: ACCENT, opacity: 0.55 }); flag.visible = false; setState('hi'); }
        else if (D.t - D.bestT > 3) { flag.visible = false; setState('look'); }
      }
      return c;
    }

    function sendTo(x, z) {
      if (!dry(x, z, 0.05)) {
        ring(x, z, { r0: 0.05, r1: 0.45, dur: 0.8, color: INK, opacity: 0.35, y: WATER });
        D.note = { text: 'Pip can’t swim', until: D.clock + 2.2 };
        return false;
      }
      D.goal.set(x, 0, z);
      setState('goto', { best: 1e9, bestT: 0 });
      flag.position.set(x, height(x, z), z); flag.visible = true; flag.userData.t = 0;
      ring(x, z, { r0: 0.05, r1: 0.32, dur: 0.5, color: ACCENT, opacity: 0.5 });
      return true;
    }

    // ================================================================ camera: fixed isometric angle, follows Pip, rotates in 90° steps
    const _look = new THREE.Vector3();
    function updateCamera(dt, snap = false) {
      const k = snap ? 1 : damp(2.4, dt);
      cam.x += (pip.x + Math.sin(pip.h) * pip.v * 0.8 - cam.x) * k;
      cam.z += (pip.z + Math.cos(pip.h) * pip.v * 0.8 - cam.z) * k;
      cam.y += (pip.gy + 0.45 - cam.y) * k;
      cam.az = wrap(cam.az + angTo(cam.az, cam.azT) * (snap ? 1 : damp(5, dt)));
      cam.zoom += (cam.zoomT - cam.zoom) * (snap ? 1 : damp(6, dt));
      const ce = Math.cos(CAM_EL) * CAM_DIST, se = Math.sin(CAM_EL) * CAM_DIST;
      camera.position.set(cam.x + Math.sin(cam.az) * ce, cam.y + se, cam.z + Math.cos(cam.az) * ce);
      camera.lookAt(_look.set(cam.x, cam.y, cam.z));
      if (Math.abs(camera.zoom - cam.zoom) > 1e-4) { camera.zoom = cam.zoom; camera.updateProjectionMatrix(); }
      key.position.set(cam.x + KEY_OFF.x, cam.y + KEY_OFF.y, cam.z + KEY_OFF.z);
      key.target.position.set(cam.x, cam.y, cam.z);
    }
    const rotate = (dir) => { cam.azT = wrap(cam.azT + dir * Math.PI / 2); };
    const zoomBy = (f) => { cam.zoomT = clamp(cam.zoomT * f, 0.6, 2.2); };

    // ================================================================ per-frame effects
    function updateFx(dt) {
      for (const P of prints) {
        if (P.age > PRINT_LIFE) continue;
        P.age += dt;
        P.m.material.opacity = 0.22 * (1 - Math.min(1, P.age / PRINT_LIFE));
        P.m.visible = P.age < PRINT_LIFE;
      }
      for (let i = rings.length - 1; i >= 0; i--) {
        const r = rings[i];
        r.t += dt / r.dur;
        const e = 1 - Math.pow(1 - Math.min(1, r.t), 3);
        r.m.scale.setScalar(r.r0 + (r.r1 - r.r0) * e);
        r.m.material.opacity = r.opacity * (1 - Math.min(1, r.t));
        if (r.t >= 1) { scene.remove(r.m); r.m.material.dispose(); rings.splice(i, 1); }
      }
      // trees standing between the camera and Pip turn see-through
      const cx = Math.sin(cam.az), cz = Math.cos(cam.az);
      for (const E of props.values()) {
        const P = E.P;
        if (!P) continue;
        const dx = P.x - pip.x, dz = P.z - pip.z, along = dx * cx + dz * cz, across = Math.abs(dx * cz - dz * cx);
        const hide = along > -0.2 && along < 2.6 && across < P.r + 0.42 && P.type !== 'stake';
        P.m.material = hide ? MAT.propGhost : MAT.prop;
      }
      if (flag.visible) {
        const F = flag.userData;
        F.t += dt;
        F.hinge.rotation.y = Math.sin(F.t * 5) * 0.25;
      }
    }

    // ================================================================ UI
    let paused = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const PLAY = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 2.8v10.4L13 8z" fill="currentColor"/></svg><span>Play</span>';
    const PAUSE = '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="2.8" width="3.2" height="10.4" rx="1" fill="currentColor"/><rect x="9.3" y="2.8" width="3.2" height="10.4" rx="1" fill="currentColor"/></svg><span>Pause</span>';
    function setPaused(p) {
      paused = p;
      const b = $('#btn-play');
      b.innerHTML = p ? PLAY : PAUSE;
      b.setAttribute('aria-label', p ? 'Play' : 'Pause');
      showStatus();
    }
    function sayHi() { if (D.state !== 'hi') setState('hi'); if (paused) setPaused(false); }
    function showStatus() {
      $('#doing').textContent = paused ? 'Paused' : D.note && D.clock < D.note.until ? D.note.text : LABEL[D.state];
      $('#st-steps').textContent = pip.steps.toLocaleString();
      const m = pip.dist * M_PER_UNIT;
      $('#st-dist').textContent = m < 100 ? m.toFixed(1) : Math.round(m).toLocaleString();
      const gi = Math.floor(pip.x / GRID), gj = Math.floor(pip.z / GRID);
      $('#st-grid').textContent = `${Math.abs(gi)}${gi >= 0 ? 'E' : 'W'} ${Math.abs(gj)}${gj >= 0 ? 'N' : 'S'}`;
    }
    let hintGone = false;
    function hideHint() { if (!hintGone) { hintGone = true; $('#hint').classList.add('gone'); } }
    if (coarse) $('#hint-verb').textContent = 'Tap';
    setTimeout(hideHint, 14000);

    $('#btn-play').addEventListener('click', () => setPaused(!paused));
    $('#btn-hi').addEventListener('click', sayHi);
    $('#rot-l').addEventListener('click', () => rotate(-1));
    $('#rot-r').addEventListener('click', () => rotate(1));
    $('#zoom-in').addEventListener('click', () => zoomBy(1.25));
    $('#zoom-out').addEventListener('click', () => zoomBy(0.8));
    canvas.addEventListener('wheel', (e) => { e.preventDefault(); zoomBy(Math.exp(-e.deltaY * 0.0015)); }, { passive: false });

    // click → march the view ray down onto the height field
    const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
    function pickGround(clientX, clientY) {
      const r = canvas.getBoundingClientRect();
      ndc.set(((clientX - r.left) / r.width) * 2 - 1, -((clientY - r.top) / r.height) * 2 + 1);
      ray.setFromCamera(ndc, camera);
      const o = ray.ray.origin, d = ray.ray.direction;
      for (let t = CAM_DIST * 0.5; t < CAM_DIST * 1.6; t += 0.04) {
        const x = o.x + d.x * t, y = o.y + d.y * t, z = o.z + d.z * t;
        if (y <= Math.max(height(x, z), WATER)) return { x, z };
      }
      return null;
    }
    canvas.addEventListener('click', (e) => {
      const p = pickGround(e.clientX, e.clientY);
      if (!p) return;
      sendTo(p.x, p.z);
      hideHint();
      if (paused) setPaused(false);
      showStatus();
    });
    addEventListener('keydown', (e) => {
      if (e.target.closest?.('button') && (e.key === ' ' || e.key === 'Enter')) return;
      const k = e.key.toLowerCase();
      if (k === ' ' || k === 'p') { e.preventDefault(); setPaused(!paused); }
      else if (k === 'w') sayHi();
      else if (k === 'q') rotate(-1);
      else if (k === 'e') rotate(1);
      else if (k === '+' || k === '=') zoomBy(1.25);
      else if (k === '-' || k === '_') zoomBy(0.8);
      else if (k === 'h') document.body.classList.toggle('rec');
    });

    function resize() {
      const w = canvas.clientWidth, h = canvas.clientHeight;
      if (!w || !h) return;
      renderer.setSize(w, h, false);
      const aspect = w / h;
      let halfW = VIEW_H * aspect, halfH = VIEW_H;
      if (halfW < 3.1) { halfW = 3.1; halfH = halfW / aspect; }         // portrait phones: keep enough map across
      Object.assign(camera, { left: -halfW, right: halfW, top: halfH, bottom: -halfH });
      camera.updateProjectionMatrix();
    }
    addEventListener('resize', resize);
    resize();

    // ================================================================ loop
    let last = performance.now(), hud = 0;
    function step(dt) {
      updateProps(dt);
      nearProps(3.5);
      pip.update(dt, think(dt));
      updateFx(dt);
    }
    function frame(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      if (!paused) step(dt);
      updateCamera(dt);
      recenterTerrain(cam.x, cam.z);
      U.uTime.value += dt;
      hud -= dt;
      if (hud <= 0) { hud = 0.2; showStatus(); }
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }

    recenterTerrain(cam.x, cam.z);
    updateProps(0, true);
    nearProps(3.5);
    for (let i = 0; i < 30; i++) pip.update(1 / 60, { vt: 0, wt: 0 });
    updateCamera(0, true);
    setPaused(paused);
    renderer.render(scene, camera);
    $('#loader').classList.add('gone');
    window.pip = { pip, D, cam, props, setState, sendTo, sayHi, setPaused, step, rotate, zoomBy, updateCamera: (dt) => { updateCamera(dt); recenterTerrain(cam.x, cam.z); }, render: () => renderer.render(scene, camera) };
    requestAnimationFrame((t) => { last = t; frame(t); });
  </script>
</body>
</html>
